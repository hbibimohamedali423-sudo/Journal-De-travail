/* =========================================================
   BASIC HELPERS
   ========================================================= */

function $(id){
  return document.getElementById(id);
}

function esc(v){
  return String(v ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function today(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const day = String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}

function fmtDate(v){
  if(!v) return "";
  const d = new Date(v + "T12:00:00");
  if(isNaN(d)) return v;
  return d.toLocaleDateString("fr-FR",{
    weekday:"short",
    day:"2-digit",
    month:"2-digit",
    year:"numeric"
  });
}

function fmtTime(v){
  if(!v) return "--:--";
  const d = new Date(v);
  if(isNaN(d)) return String(v).slice(0,5);
  return d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
}

function toast(msg){
  const x = $("toast");
  if(!x) return;
  x.textContent = msg;
  x.style.display = "block";
  clearTimeout(window.__toast);
  window.__toast = setTimeout(()=>{
    x.style.display = "none";
  },2800);
}

function showError(title,error){
  const message = error?.message || String(error || "Erreur inconnue");
  $("app").innerHTML = `
    <section class="sec">
      <h2>${esc(title)}</h2>
      <div class="error">${esc(message)}</div>
      <div class="bar" style="margin-top:12px">
        <button class="p" data-a="reload">Réessayer</button>
        <button data-a="logout">Retour</button>
      </div>
    </section>
  `;
}

function startClock(){
  const tick=()=>{
    const d=new Date();
    $("clk").textContent=d.toLocaleTimeString("fr-FR",{
      hour:"2-digit",
      minute:"2-digit",
      second:"2-digit"
    });
  };
  tick();
  setInterval(tick,1000);
}

   DATABASE HELPERS

async function getProfile(userId){
  const r = await sb
    .from("profiles")
    .select("*")
    .eq("id",userId)
    .maybeSingle();

  if(r.error) throw r.error;

  if(r.data) return r.data;

  return {
    id:userId,
    name:me?.user_metadata?.name || me?.email || "",
    role:"employee",
    start:"08:00",
    h:8
  };
}

/*
  The application accepts several possible column names so that
  small schema differences do not crash the interface.
*/

function normalizeDay(row){
  if(!row) return null;

  return {
    raw:row,
    id:row.id,
    day:row.day || row.date || row.work_day || currentDay,
    in_at:
      row.in_at ||
      row.clock_in ||
      row.start_at ||
      row.entry_at ||
      null,
    out_at:
      row.out_at ||
      row.clock_out ||
      row.end_at ||
      row.exit_at ||
      null,
    notes:
      row.notes ||
      row.note ||
      row.observations ||
      "",
    tasks:
      row.tasks ||
      row.task ||
      "",
    status:
      row.status ||
      row.validation ||
      "pending",
    review:
      row.review ||
      row.manager_note ||
      ""
  };
}

async function loadMyDays(){
  if(!me) return;

  const r = await sb
    .from("days")
    .select("*")
    .eq("user_id",me.id)
    .order("day",{ascending:false})
    .limit(100);

  if(r.error){
    console.warn("days:",r.error);
    days = {};
    return;
  }

  days = {};

  (r.data || []).forEach(row=>{
    const d = normalizeDay(row);
    if(d && d.day) days[d.day]=d;
  });
}

function getDay(day=currentDay){
  return days[day] || {
    day,
    in_at:null,
    out_at:null,
    notes:"",
    tasks:"",
    status:"pending",
    review:""
  };
}

async function login(){
  const email=$("em")?.value.trim();
  const password=$("pw")?.value;

  if(!email || !password){
    $("loginMsg").innerHTML=`<div class="error">E-mail et mot de passe obligatoires.</div>`;
    return;
  }

  $("loginMsg").innerHTML=`<div class="muted">Connexion...</div>`;

  const r=await sb.auth.signInWithPassword({
    email,
    password
  });

  if(r.error){
    $("loginMsg").innerHTML=`<div class="error">${esc(r.error.message)}</div>`;
    return;
  }

  await init();
}

async function signup(){
  const email=$("em")?.value.trim();
  const password=$("pw")?.value;

  if(!email || !password){
    $("loginMsg").innerHTML=`<div class="error">E-mail et mot de passe obligatoires.</div>`;
    return;
  }

  if(password.length<6){
    $("loginMsg").innerHTML=`<div class="error">Le mot de passe doit contenir au moins 6 caractères.</div>`;
    return;
  }

  $("loginMsg").innerHTML=`<div class="muted">Création du compte...</div>`;

  const r=await sb.auth.signUp({
    email,
    password,
    options:{
      data:{
        name:email.split("@")[0]
      }
    }
  });

  if(r.error){
    $("loginMsg").innerHTML=`<div class="error">${esc(r.error.message)}</div>`;
    return;
  }

  if(!r.data.session){
    $("loginMsg").innerHTML=`
      <div class="success">
        Compte créé. Vérifiez votre e-mail si la confirmation est activée,
        puis connectez-vous.
      </div>`;
    return;
  }

  await init();
}

/* =========================================================
   SAVE DAY
   ========================================================= */

async function saveDay(extra={}){
  if(!me) return;

  const day=$("dayDate")?.value || currentDay;
  const old=getDay(day);

  const tasks=$("tasks")?.value ?? old.tasks ?? "";
  const notes=$("notes")?.value ?? old.notes ?? "";

  /*
    First try the common schema.
    If your existing schema has a different field name,
    the error is shown instead of freezing the application.
  */

  const payload={
    user_id:me.id,
    day,
    notes,
    tasks,
    ...extra
  };

  let r;

  if(old.id){
    r=await sb
      .from("days")
      .update(payload)
      .eq("id",old.id)
      .select()
      .single();
  }else{
    r=await sb
      .from("days")
      .insert(payload)
      .select()
      .single();
  }

  if(r.error){
    console.error("SAVE DAY ERROR",r.error);

    /*
      Keep the local data so the interface remains usable.
    */
    days[day]={
      ...old,
      ...payload
    };

    toast("Données conservées localement — erreur base de données");
    showError(
      "Erreur lors de l'enregistrement",
      r.error.message
    );
    return;
  }

  const nd=normalizeDay(r.data);
  days[day]=nd;

  currentDay=day;
  toast("Enregistré");
  render();
}

async function clockIn(){
  const d=getDay(currentDay);

  if(d.in_at){
    toast("Entrée déjà enregistrée");
    return;
  }

  await saveDay({
    in_at:new Date().toISOString()
  });
}

async function clockOut(){
  const d=getDay(currentDay);

  if(!d.in_at){
    toast("Vous devez d'abord pointer l'entrée");
    return;
  }

  if(d.out_at){
    toast("Sortie déjà enregistrée");
    return;
  }

  await saveDay({
    out_at:new Date().toISOString()
  });
}

   ========================================================= */

async function loadTeam(){
  if(!me || prof?.role!=="manager") return;

  const r=await sb
    .from("profiles")
    .select("*")
    .eq("role","employee")
    .order("name",{ascending:true});

  if(r.error){
    console.error(r.error);
    team=[];
    return;
  }

  team=r.data || [];
}

function renderTeam(){
  $("headSub").textContent="Gestion de l'équipe";

  if(selectedEmployee && selectedTeamDay){
    renderTeamDay();
    return;
  }

  if(selectedEmployee){
    renderEmployeeDays();
    return;
  }

  $("app").innerHTML=`
    <section class="sec">
      <h2>Équipe</h2>
      <div class="muted">
        Sélectionnez un technicien pour consulter ses journées.
      </div>

      <div style="margin-top:10px">
        ${
          team.length
          ? team.map(x=>`
            <div class="row">
              <div>
                <strong>${esc(x.name || x.email || x.id)}</strong>
                <div class="muted">
                  ${esc(x.job || "")}
                </div>
              </div>

              <button
                data-a="selectEmployee"
                data-id="${esc(x.id)}">
                Ouvrir
              </button>
            </div>
          `).join("")
          : `<div class="empty">Aucun employé trouvé.</div>`
        }
      </div>
    </section>
  `;
}

async function selectEmployee(id){
  selectedEmployee=team.find(x=>x.id===id) || null;
  selectedTeamDay=null;
  selectedEmployeeDays=[];

  if(!selectedEmployee){
    renderTeam();
    return;
  }

  const r=await sb
    .from("days")
    .select("*")
    .eq("user_id",id)
    .order("day",{ascending:false})
    .limit(100);

  if(r.error){
    showError("Erreur de lecture des journées",r.error);
    return;
  }

  selectedEmployeeDays=(r.data||[]).map(normalizeDay);
  renderTeam();
}

function renderEmployeeDays(){
  const e=selectedEmployee;

  $("app").innerHTML=`
    <section class="sec">
      <div class="bar">
        <button data-a="backTeam">← Équipe</button>
      </div>

      <h2 style="margin-top:12px">
        ${esc(e?.name || e?.email || "")}
      </h2>

      <div class="muted">
        ${esc(e?.job || "")}
      </div>
    </section>

    <section class="sec">
      <h3>Journées</h3>

      ${
        selectedEmployeeDays.length
        ? selectedEmployeeDays.map(d=>`
          <div class="row">
            <div>
              <strong>${esc(fmtDate(d.day))}</strong>
              <div class="muted">
                ${fmtTime(d.in_at)} → ${fmtTime(d.out_at)}
              </div>
            </div>

            <button
              data-a="teamDay"
              data-day="${esc(d.day)}">
              Consulter
            </button>
          </div>
        `).join("")
        : `<div class="empty">Aucune journée enregistrée.</div>`
      }
    </section>
  `;
}

function renderTeamDay(){
  const d=selectedTeamDay;

  $("app").innerHTML=`
    <section class="sec">
      <div class="bar">
        <button data-a="backEmployee">← Retour</button>
      </div>

      <h2 style="margin-top:12px">
        ${esc(fmtDate(d.day))}
      </h2>

      <div class="muted">
        ${esc(selectedEmployee?.name || "")}
      </div>
    </section>

    <section class="sec">
      <div class="grid">
        <div class="card">
          <div class="muted">Entrée</div>
          <strong>${fmtTime(d.in_at)}</strong>
        </div>

        <div class="card">
          <div class="muted">Sortie</div>
          <strong>${fmtTime(d.out_at)}</strong>
        </div>
      </div>
    </section>

    <section class="sec">
      <h3>Tâches</h3>
      <div>${esc(d.tasks || "—")}</div>
    </section>

    <section class="sec">
      <h3>Notes</h3>
      <div>${esc(d.notes || "—")}</div>
    </section>

    <section class="sec">
      <h3>Validation</h3>

      <div class="bar">
        <button class="ok"
          data-a="validateDay"
          data-id="${esc(d.id)}">
          ✓ Valider
        </button>
      </div>
    </section>
  `;
}

async function validateDay(id){
  if(!id) return;

  const r=await sb
    .from("days")
    .update({status:"validated"})
    .eq("id",id);

  if(r.error){
    showError("Impossible de valider la journée",r.error);
    return;
  }

  const d=selectedEmployeeDays.find(x=>x.id===id);
  if(d) d.status="validated";

  if(selectedTeamDay?.id===id){
    selectedTeamDay.status="validated";
  }

  toast("Journée validée");
  renderTeam();
}

/* =========================================================
   PHOTOS
   ========================================================= */

async function uploadPhoto(){
  const file=$("photoInput")?.files?.[0];

  if(!file){
    toast("Choisissez une photo");
    return;
  }

  if(!me){
    toast("Non connecté");
    return;
  }

  const status=$("photoStatus");
  if(status) status.innerHTML=`<div class="muted">Téléchargement...</div>`;

  const ext=file.name.split(".").pop() || "jpg";
  const path=`${me.id}/${currentDay}/${Date.now()}.${ext}`;

  const r=await sb.storage
    .from("photos")
    .upload(path,file,{
      upsert:false,
      contentType:file.type || "image/jpeg"
    });

  if(r.error){
    console.error(r.error);
    if(status) status.innerHTML=
      `<div class="error">${esc(r.error.message)}</div>`;
    return;
  }

  const s=await sb.storage
    .from("photos")
    .createSignedUrl(path,3600);

  if(status){
    status.innerHTML=`
      <div class="success">Photo enregistrée.</div>
      ${s.data?.signedUrl
        ? `<img class="photo" src="${esc(s.data.signedUrl)}" alt="Photo">`
        : ""}
    `;
  }
}

/* =========================================================
   MAIN RENDER
   ========================================================= */

function render(){
  try{
    if(!me){
      renderLogin();
      return;
    }

    renderNav();

    if(currentView==="dash"){
      renderDashboard();
      return;
    }

    if(currentView==="day"){
      renderToday();
      return;
    }

    if(currentView==="history"){
      renderHistory();
      return;
    }

    if(currentView==="more"){
      renderMore();
      return;
    }

    if(currentView==="team" && prof?.role==="manager"){
      renderTeam();
      return;
    }

    currentView="dash";
    renderDashboard();

  }catch(e){
    console.error("RENDER ERROR",e);
    showError("Erreur d'affichage",e);
  }
}

/* =========================================================
   INIT
   ========================================================= */

async function init(){
  try{
    if(!sb){
      if(!window.supabase){
        throw new Error(
          "La bibliothèque Supabase n'a pas été chargée. Vérifiez votre connexion Internet."
        );
      }

      sb=window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );
    }

    const sessionResult=await sb.auth.getSession();

    if(sessionResult.error){
      throw sessionResult.error;
    }

    const session=sessionResult.data?.session;

    if(!session){
      me=null;
      prof=null;
      renderLogin();
      return;
    }

    me=session.user;

    prof=await getProfile(me.id);

    /*
      Never let a missing profile stop the application.
    */
    if(!prof){
      prof={
        id:me.id,
        name:me.email || "",
        role:"employee",
        start:"08:00",
        h:8
      };
    }

    await loadMyDays();

    if(prof.role==="manager"){
      await loadTeam();
    }

    render();

  }catch(e){
    console.error("INIT ERROR",e);

    $("headSub").textContent="Erreur";

    $("app").innerHTML=`
      <section class="sec">
        <h2>Le chargement a rencontré un problème</h2>

        <div class="error">${esc(e?.message || e)}</div>

        <div class="muted" style="margin-top:10px">
          L'application est bien chargée, mais une opération Supabase
          a échoué. Cette erreur est affichée ici volontairement afin
          d'éviter que l'écran reste bloqué sur JT.
        </div>

        <div class="bar" style="margin-top:14px">
          <button class="p" data-a="reload">Réessayer</button>
        </div>
      </section>
    `;
  }
}

/* =========================================================
   CLICK HANDLER — ONE ONLY
   ========================================================= */

document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-a]");
  if(!b) return;

  const a=b.dataset.a;

  try{

    if(a==="login"){
      await login();
      return;
    }

    if(a==="signup"){
      await signup();
      return;
    }

    if(a==="logout"){
      await logout();
      return;
    }

    if(a==="reload"){
      location.reload();
      return;
    }

    if(a==="dash"){
      currentView="dash";
      selectedEmployee=null;
      selectedTeamDay=null;
      render();
      return;
    }

    if(a==="day"){
      currentView="day";
      selectedEmployee=null;
      selectedTeamDay=null;
      render();
      return;
    }

    if(a==="history"){
      currentView="history";
      selectedEmployee=null;
      selectedTeamDay=null;
      render();
      return;
    }

    if(a==="more"){
      currentView="more";
      selectedEmployee=null;
      selectedTeamDay=null;
      render();
      return;
    }

    if(a==="team"){
      currentView="team";
      selectedEmployee=null;
      selectedTeamDay=null;
      render();
      return;
    }

    if(a==="clockin"){
      await clockIn();
      return;
    }

    if(a==="clockout"){
      await clockOut();
      return;
    }

    if(a==="saveDay"){
      await saveDay();
      return;
    }

    if(a==="openDay"){
      currentDay=b.dataset.day;
      currentView="day";
      render();
      return;
    }

    if(a==="selectEmployee"){
      await selectEmployee(b.dataset.id);
      return;
    }

    if(a==="backTeam"){
      selectedEmployee=null;
      selectedEmployeeDays=[];
      selectedTeamDay=null;
      renderTeam();
      return;
    }

    if(a==="teamDay"){
      selectedTeamDay=
        selectedEmployeeDays.find(x=>x.day===b.dataset.day) || null;
      renderTeam();
      return;
    }

    if(a==="backEmployee"){
      selectedTeamDay=null;
      renderTeam();
      return;
    }

    if(a==="validateDay"){
      await validateDay(b.dataset.id);
      return;
    }

  }catch(err){
    console.error("CLICK ERROR",err);
    showError("Erreur",err);
  }
});

/* =========================================================
   DATE CHANGE
   ========================================================= */

document.addEventListener("change",e=>{
  if(e.target.id==="dayDate"){
    currentDay=e.target.value || today();
    renderToday();
  }

  if(e.target.id==="photoInput"){
    uploadPhoto();
  }
});

/* =========================================================
   AUTH STATE
   ========================================================= */

function setupAuthListener(){
  if(!sb) return;

  sb.auth.onAuthStateChange((event,session)=>{
    if(event==="SIGNED_OUT"){
      me=null;
      prof=null;
      days={};
      renderLogin();
    }

    if(event==="SIGNED_IN" && session && !me){
      /*
        Avoid calling init recursively while Supabase is still
        processing the auth event.
      */
      setTimeout(()=>init(),0);
    }
  });
}

/* =========================================================
   GLOBAL ERROR PROTECTION
   ========================================================= */

window.addEventListener("error",e=>{
  console.error("GLOBAL JS ERROR",e.error || e.message);

  if($("app") && !me){
    $("app").innerHTML=`
      <section class="sec">
        <h2>Erreur JavaScript</h2>
        <div class="error">${esc(e.message || "Erreur inconnue")}</div>
        <div class="bar" style="margin-top:12px">
          <button class="p" data-a="reload">Recharger</button>
        </div>
      </section>
    `;
  }
});

window.addEventListener("unhandledrejection",e=>{
  console.error("UNHANDLED PROMISE",e.reason);
});

/* =========================================================
   START
   ========================================================= */

startClock();
init().then(()=>{
  if(sb) setupAuthListener();
});
</script>
