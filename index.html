<style>

*{box-sizing:border-box}

body{
  margin:0;

    radial-gradient(700px 380px at 85% -5%,rgba(30,107,255,.28),transparent 70%),

header{

.mono{

main{

input,select,textarea{

.adm{

.sec{

button{

button.p{

button.d{color:var(--bad)}

}

.bar{

.bar>*{

}

.hero{
  background:linear-gradient(135deg,#123a82,#0a1a3c);

}

.st{
  display:flex;

}

.dot{
  width:14px;

  border-radius:50%;

}

.dot.on{
  background:var(--ok);

}

.st b{
  font-size:19px;

}

.hn{
  margin-inline-start:auto;

}

.tri{
  display:grid;
  grid-template-columns:repeat(3,1fr);

}

.tri>div{
  background:linear-gradient(180deg,#0e1e3d,#0a1630);

}

}

}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);

}

}

}

.pg{
  height:6px;

}

  display:block;

}

.chips{
  display:flex;

}

}

  background:linear-gradient(90deg,#1e6bff,#3a8dff);

}

.t{
  border:1px solid var(--line);
  border-inline-start:4px solid var(--line);

}

.t.s0{border-inline-start-color:var(--pend)}
.t.s1{border-inline-start-color:var(--run)}

.th{
  display:flex;
  gap:8px;
  align-items:center;
  padding:11px;
  cursor:pointer
}

.th .n{
  flex:1;
  font-weight:600
}

.t.s2 .n{
  opacity:.6;
  text-decoration:line-through
}

.bd{
  font-size:11.5px;
  font-weight:600;
  padding:3px 10px;
  border-radius:8px;

}

.s0 .bd{
  background:rgba(245,165,36,.16);
  color:var(--pend)
}

.s1 .bd{
  background:rgba(47,139,255,.18);
  color:#6db0ff
}

.s2 .bd{
  background:rgba(25,195,125,.16);
  color:var(--ok)
}

.pr{
  width:9px;
  height:9px;
  border-radius:50%;
  background:var(--line);
  flex:none
}

.pr1{background:var(--amb)}
.pr2{background:var(--bad)}

.tb{
  display:none;
  padding:0 11px 12px
}

.t.o .tb{display:block}

.lab{

  color:var(--mut);
  margin:8px 0 3px
}

.seg{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px
}

.seg .on{
  background:linear-gradient(90deg,#1e6bff,#3a8dff);
  border-color:#2f7dff;
  color:#fff
}

.two{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px
}

.ph{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:8px
}

.ph div{position:relative}

.ph img{
  width:84px;
  height:84px;
  object-fit:cover;
  border-radius:10px;

}

.ph .x{
  position:absolute;
  top:3px;
  inset-inline-start:3px;
  background:rgba(0,0,0,.7);

  border:0;
  border-radius:50%;

  height:24px;
  padding:0
}

.h,.rw{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:11px 0;
  border-bottom:1px solid #12274d;

}

.rw>div{
  flex:1;
  min-width:0
}

.rw b{display:block}

.tag{
  font-size:11.5px;

}

.tag.o{color:var(--ok)}

.pill{
  font-size:12px;
  background:rgba(47,139,255,.18);
  color:#6db0ff;
  padding:2px 10px;
  border-radius:12px;
  text-transform:none;
  letter-spacing:0
}

.wd{
  display:flex;
  justify-content:space-between;
  padding:0 2px;
  font-size:11px;
  color:var(--mut)
}

.dw{
  display:flex;
  align-items:center;
  gap:18px
}

.dn{
  width:118px;
  height:118px;
  border-radius:50%;
  display:grid;
  place-items:center;
  position:relative;
  flex:none
}

.dn::after{
  content:"";

  inset:15px;
  border-radius:50%;
  background:#0a1630
}

.dn b{
  position:relative;
  z-index:1;
  font-size:22px
}

.lg2{flex:1}

.lg2 div{
  display:flex;
  align-items:center;
  gap:8px;
  margin:6px 0;
  font-size:14px
}

.lg2 i{
  width:10px;
  height:10px;
  border-radius:50%
}

.lg2 b{margin-inline-start:auto}

.lg{
  text-align:center;
  padding:30px 0 6px
}

.lgo{
  width:88px;
  height:88px;
  margin:0 auto 14px;
  border-radius:26px;
  background:linear-gradient(135deg,#1e6bff,#7a5cff);
  display:grid;
  place-items:center;
  font-size:32px;
  font-weight:700;
  box-shadow:0 0 44px rgba(47,139,255,.55)
}

.lg h2{
  font-size:26px;
  margin:0
}

.lg p{
  color:var(--mut);
  margin:4px 0 0
}

.nav{
  position:fixed;
  bottom:0;
  inset-inline:0;
  background:rgba(5,11,24,.94);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  border-top:1px solid #12274d;
  display:flex;
  padding-bottom:env(safe-area-inset-bottom,0px);
  z-index:6
}

.nav:empty{display:none}

.nav button{
  flex:1;
  border:0;
  border-radius:0;
  padding:9px 0 8px;
  background:none;
  color:var(--mut);
  font-size:11px;
  font-weight:600;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px
}

.nav .on{color:#4da0ff}

.nav .on svg{
  filter:drop-shadow(0 0 6px rgba(77,160,255,.8))
}

.ov{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.88);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:9;

}

.ov.on{display:flex}

.ov img{
  max-width:100%;

}

.bx{

  border:1px solid var(--line);

  border-radius:14px;
  width:100%;
  max-width:600px
}

#toast{
  position:fixed;
  bottom:84px;
  inset-inline:0;
  margin:auto;
  width:max-content;
  max-width:90%;
  background:#1e6bff;
  color:#fff;
  padding:8px 16px;
  border-radius:20px;
  opacity:0;
  transition:opacity .25s;
  z-index:10;
  pointer-events:none
}

#toast.on{opacity:1}

.em{
  text-align:center;
  color:var(--mut);
  padding:14px
}
</style>
</head>

<body>

<header>
  <div class="mono" id="mn">JT</div>
  <div>
    <h1 id="ttl">Journal de travail</h1>
    <div class="sub" id="sb"></div>
  </div>
  <div class="clk" id="clk"></div>
</header>

<main id="app"></main>

<nav class="nav" id="nv"></nav>

<div class="ov" id="lb">
  <img alt="">
</div>

<div class="ov" id="sh">
  <div class="bx">
    <textarea id="shT" readonly style="min-height:240px"></textarea>
    <div class="bar" style="margin-top:8px">
      <button class="p" data-a="cp">Copier</button>
      <button data-a="cl">Fermer</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>

/* =========================================================
   SUPABASE
   ========================================================= */

const SB_URL='https://khyeypvhsumpboskcdny.supabase.co';
const SB_KEY='sb_publishable_5Hf8Zg1mauJRQRKtMSg99A_HI8vVbH2';

const $=s=>document.querySelector(s);
const sb=supabase.createClient(SB_URL,SB_KEY);


/* =========================================================
   ÉTAT GLOBAL
   ========================================================= */

let me=null;
let prof=null;

let days={};
let rev={};

let view='dash';
let flt=-1;

let team=[];
let teamSel=null;
let teamDay=null;
let tdays=[];
let trev={};

let ords=[];
let tords=[];

const ds=d=>
  d.getFullYear()+
  '-'+String(d.getMonth()+1).padStart(2,'0')+
  '-'+String(d.getDate()).padStart(2,'0');

const today=()=>ds(new Date());

let cur=today();

const open=new Set();
const urls={};
const dirty=new Set();
const mt={};

const ST=['Nouvelle','En cours','Terminée'];
const PR=['Normale','Importante','Urgente'];

const hm=t=>
  t
    ?new Date(t).toLocaleTimeString('en-GB',{
        hour:'2-digit',
        minute:'2-digit'
      })
    :'—';

const dur=m=>
  Math.floor(m/60)+' h '+String(m%60).padStart(2,'0');

const esc=s=>
  String(s||'').replace(
    /[&<>"]/g,
    c=>({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;'
    }[c])
  );


/* =========================================================
   DONNÉES D'UNE JOURNÉE
   ========================================================= */

const day=(k=cur)=>{
  const d=days[k]||(days[k]={});

  d.brk=d.brk||[];
  d.tasks=d.tasks||[];
  d.loc=d.loc||'';
  d.note=d.note||'';

  return d;
};

const R=(k,t='')=>
  (rev[k]&&rev[k][t])||{};


/* =========================================================
   TOAST
   ========================================================= */

function toast(m){
  const t=$('#toast');

  if(!t)return;

  t.textContent=m;
  t.classList.add('on');

  clearTimeout(toast.t);

  toast.t=setTimeout(
    ()=>t.classList.remove('on'),
    2200
  );
}


/* =========================================================
   CALCUL TEMPS
   ========================================================= */

function stats(d,live){

  if(!d.in)
    return{
      net:0,
      brk:0,
      late:0
    };

  const end=d.out||(live?Date.now():d.in);

  let b=0;

  (d.brk||[]).forEach(x=>{
    b+=((x[1]||end)-x[0]);
  });

  const s=new Date(d.in);

  const [h,m]=((prof&&prof.start)||'08:00').split(':');

  s.setHours(+h,+m,0,0);

  return{
    net:Math.max(
      0,
      Math.round((end-d.in-b)/60000)
    ),
    brk:Math.round(b/60000),
    late:Math.max(
      0,
      Math.round((d.in-s)/60000)
    )
  };
}


/* =========================================================
   SAUVEGARDE
   ========================================================= */

let tm;

function save(){

  dirty.add(cur);

  clearTimeout(tm);

  tm=setTimeout(
    flush,
    700
  );
}

async function flush(){

  if(!me)return;

  for(const k of [...dirty]){

    dirty.delete(k);

    const r=await sb
      .from('days')
      .upsert(
        {
          user_id:me.id,
          day:k,
          data:days[k],
          updated_at:new Date().toISOString()
        },
        {
          onConflict:'user_id,day'
        }
      );

    if(r.error)
      toast('Erreur : '+r.error.message);
  }
}


let pt;

function saveProf(){

  clearTimeout(pt);

  pt=setTimeout(
    async()=>{

      if(!me||!prof)return;

      const p=prof;

      const r=await sb
        .from('profiles')
        .update({
          name:p.name,
          matricule:p.matricule,
          job:p.job,
          dep:p.dep,
          co:p.co,
          mgr:p.mgr,
          start:p.start,
          h:p.h
        })
        .eq('id',me.id);

      if(r.error)
        toast('Erreur : '+r.error.message);

    },
    700
  );
}


/* =========================================================
   REVIEWS
   ========================================================= */

const grp=(rows,o)=>{

  (rows||[]).forEach(x=>{

    (o[x.day]=o[x.day]||{})[x.task_id]=x;

  });

  return o;
};


/* =========================================================
   CHARGEMENT EMPLOYÉ
   ========================================================= */

async function loadMine(){

  if(!me)return;

  const a=await sb
    .from('days')
    .select('day,data')
    .eq('user_id',me.id)
    .order('day',{ascending:false})
    .limit(90);

  days={};

  (a.data||[]).forEach(x=>{
    days[x.day]=x.data;
  });

  const b=await sb
    .from('reviews')
    .select('*')
    .eq('user_id',me.id);

  rev=grp(b.data,{});


  /* ORDRES */

  const o=await sb
    .from('orders')
    .select('*')
    .eq('employee_id',me.id)
    .order('created_at',{ascending:false})
    .limit(100);

  if(o.error){

    ords=[];

    /*
      Si la table orders n'existe pas encore,
      l'application continue à fonctionner.
    */

  }else{

    ords=o.data||[];

  }
}


/* =========================================================
   CHARGEMENT ÉQUIPE
   ========================================================= */

async function loadTeam(){

  if(!me)return;

  /*
    On charge tous les autres comptes afin que le
    responsable puisse gérer les rôles.
  */

  const r=await sb
    .from('profiles')
    .select('*')
    .neq('id',me.id)
    .order('name');

  if(r.error){

    team=[];

    toast('Erreur : '+r.error.message);

    return;
  }

  team=r.data||[];
}


/* =========================================================
   OUVRIR UN EMPLOYÉ
   ========================================================= */

async function openEmp(id){

  teamSel=id;
  teamDay=null;

  const a=await sb
    .from('days')
    .select('day,data')
    .eq('user_id',id)
    .order('day',{ascending:false})
    .limit(60);

  tdays=a.data||[];

  const b=await sb
    .from('reviews')
    .select('*')
    .eq('user_id',id);

  trev=grp(b.data,{});


  /* ORDRES DE CET EMPLOYÉ */

  const c=await sb
    .from('orders')
    .select('*')
    .eq('employee_id',id)
    .order('created_at',{ascending:false});

  if(c.error){

    tords=[];

  }else{

    tords=c.data||[];

  }

  render();
}


/* =========================================================
   INITIALISATION
   ========================================================= */

async function init(){

  const s=await sb.auth.getSession();

  if(!s.data.session){

    me=null;
    prof=null;

    return render();
  }

  me=s.data.session.user;

  const p=await sb
    .from('profiles')
    .select('*')
    .eq('id',me.id)
    .single();

  prof=p.data||{
    role:'employee',
    name:'',
    start:'08:00',
    h:8
  };

  if(prof.role==='manager'){

    view='team';

    await loadTeam();

  }else{

    view='dash';

    await loadMine();

  }

  render();
}


/* =========================================================
   PRÉSENCE
   ========================================================= */

function act(a){

  cur=today();

  const d=day();
  const n=Date.now();
  const ob=d.brk[d.brk.length-1];

  if(a==='in'){

    if(d.in)
      return toast('Arrivée déjà enregistrée');

    d.in=n;

    toast('Arrivée enregistrée');

  }

  else if(a==='out'){

    if(!d.in)
      return toast("Enregistrez d'abord l'arrivée");

    if(ob&&!ob[1])
      ob[1]=n;

    d.out=n;

    toast('Départ enregistré');

  }

  else if(a==='bs'){

    if(!d.in||d.out)
      return toast('Pause impossible maintenant');

    if(ob&&!ob[1])
      return toast('Pause déjà en cours');

    d.brk.push([n,null]);

    toast('Pause commencée');

  }

  else if(a==='be'){

    if(!ob||ob[1])
      return toast('Aucune pause en cours');

    ob[1]=n;

    toast('Retour de pause');

  }

  else if(a==='re'){

    d.out=null;

    toast('Journée rouverte');
  }

  save();
  render();
}


/* =========================================================
   COMMANDE RAPIDE / NOUVELLE TÂCHE
   ========================================================= */

function cmd(v){

  v=v.trim();

  if(!v)return;

  const k=v
    .toLowerCase()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g,'');

  const m={
    'arrivee':'in',
    'arrive':'in',
    'debut':'in',
    'depart':'out',
    'fin':'out',
    'sortie':'out',
    'pause':'bs',
    'retour':'be',
    'reprise':'be'
  };

  if(m[k])
    return act(m[k]);

  cur=today();

  const u=v[0]==='!';

  const o={
    id:Date.now(),
    t:u?v.slice(1).trim():v,
    s:0,
    pr:u?2:0,
    cat:'',
    mat:'',
    n:'',
    p:[],
    st:null,
    en:null
  };

  if(!o.t)return;

  day().tasks.push(o);

  open.add(o.id);

  save();

  render();
}

/* =========================================================
   PHOTOS
   ========================================================= */

async function hydrate(){

  const im=[
    ...document.querySelectorAll('img[data-p]')
  ];

  const need=[
    ...new Set(
      im
        .map(i=>i.dataset.p)
        .filter(p=>p&&!urls[p])
    )
  ];

  if(need.length){

    const r=await sb
      .storage
      .from('photos')
      .createSignedUrls(
        need,
        3600
      );

    (r.data||[]).forEach(x=>{

      if(x.signedUrl)
        urls[x.path]=x.signedUrl;

    });
  }

  im.forEach(i=>{

    if(urls[i.dataset.p])
      i.src=urls[i.dataset.p];

  });
}

function rHist(){

      )
      .sort()

  let tot=0;
  let dd=0;

  ks.forEach(k=>{

      tot+=s.net;

      if(s.net)

    }

function dRep(k){

  const d=day(k);

  const s=stats(d);

  const r=R(k);

  let x=
`RAPPORT ${k}
${prof.co||''}
${prof.name||''} ${prof.matricule||''} ${prof.job||''}
Arrivée ${hm(d.in)} | Départ ${hm(d.out)} | Pause ${s.brk} min | Net ${dur(s.net)}
`;

  d.tasks.forEach((t,i)=>{

    const q=
      R(
        k,
        String(t.id)
      ).note;

    x+=
`
${i+1}) ${t.t} [${ST[t.s]}]
`+
(
  t.st
    ?`   ${hm(t.st)}-${hm(t.en)}
`
    :''
)+
(
  t.mat
    ?`   Matériel : ${t.mat}
`
    :''
)+
(
  t.n
    ?`   Remarques : ${t.n}
`
    :''
)+
(
  t.p.length
    ?`   Photos : ${t.p.length}
`
    :''
)+
(
  q
    ?`   Direction : ${q}
`
    :''
);

  });

  return x+
  (
    r.validated_at
      ?`\nValidé par ${r.manager_name}`
      :'\nNon validé'
  );
}

   REVIEW MANAGER
   ========================================================= */

async function mrev(task,patch){

  const row=Object.assign(
    {
      user_id:teamSel,
      day:teamDay,
      task_id:task,
      manager_name:prof.name||''
    },
    patch
  );

  const r=await sb
    .from('reviews')
    .upsert(
      row,
      {
        onConflict:'user_id,day,task_id'
      }
    );

  if(r.error){

    toast(
      'Erreur : '+
      r.error.message
    );

    return;
  }

  const o=
    (
      trev[teamDay]=
      trev[teamDay]||{}
    );

  o[task]=Object.assign(
    o[task]||{},
    row
  );

  return 1;
}

/* =========================================================
   CLICK — UN SEUL LISTENER
   ========================================================= */

document.addEventListener(
  'click',
  async e=>{

    const b=e.target.closest(
      '[data-a],[data-v]'
    );

    if(!b)return;


    /* NAVIGATION */

    if(b.closest('.nav')){

      view=b.dataset.v;

      teamSel=null;
      teamDay=null;

      render();

      scrollTo(0,0);

      return;
    }


    const a=b.dataset.a;

    const t=
      me&&
      prof.role!=='manager'
        ?find(b)
        :null;


    /* =====================================================
       AUTH
       ===================================================== */

    if(a==='li'){

      const r=
        await sb.auth.signInWithPassword({
          email:$('#em').value.trim(),
          password:$('#pw').value
        });

      if(r.error)
        return msg(r.error.message);

      await init();

      return;
    }


    if(a==='su'){

      const r=
        await sb.auth.signUp({

          email:$('#em').value.trim(),

          password:$('#pw').value,

          options:{
            data:{
              name:$('#nm').value.trim()
            }
          }

        });

      if(r.error)
        return msg(r.error.message);

      if(r.data.session){

        await init();

      }else{

        msg(
          'Compte créé. Vérifiez votre e-mail, puis connectez-vous.'
        );

      }

      return;
    }


    if(a==='lo'){

      await sb.auth.signOut();

      me=null;
      prof=null;

      days={};
      rev={};
      team=[];
      teamSel=null;
      teamDay=null;
      ords=[];
      tords=[];

      render();

      return;
    }


    /* =====================================================
       PRÉSENCE
       ===================================================== */

    if(
      ['in','out','bs','be','re'].includes(a)
    ){

      act(a);

      return;
    }


    /* =====================================================
       ACTUALISER
       ===================================================== */

    if(a==='rf'){

      await loadMine();

      render();

      toast('Actualisé');

      return;
    }


    /* =====================================================
       AUJOURD'HUI
       ===================================================== */

    if(a==='td'){

      cur=today();

      render();

      return;
    }


    /* =====================================================
       OUVRIR JOURNAL
       ===================================================== */

    if(a==='gt'){

      view='today';

      render();

      scrollTo(0,0);

      return;
    }


    /* =====================================================
       FILTRE
       ===================================================== */

    if(a==='fl'){

      flt=+b.dataset.v;

      render();

      return;
    }


    /* =====================================================
       OUVRIR / FERMER TÂCHE
       ===================================================== */

    if(a==='tg'&&t){

      if(open.has(t.id))
        open.delete(t.id);
      else
        open.add(t.id);

      b.closest('.t').classList.toggle(
        'o'
      );

      return;
    }


    /* =====================================================
       STATUT TÂCHE
       ===================================================== */

    if(a==='set'&&t){

      const v=+b.dataset.v;

      t.s=v;

      if(v>0&&!t.st)
        t.st=Date.now();

      t.en=
        v==2
          ?Date.now()
          :null;

      if(v==0)
        t.st=null;

      save();

      render();

      return;
    }


    /* =====================================================
       SUPPRIMER TÂCHE
       ===================================================== */

    if(a==='del'&&t){

      const d=day();

      sb.storage
        .from('photos')
        .remove(t.p);

      d.tasks=
        d.tasks.filter(
          x=>x!==t
        );

      save();

      render();

      return;
    }


    /* =====================================================
       SUPPRIMER PHOTO
       ===================================================== */

    if(a==='rp'&&t){

      const p=
        t.p.splice(
          +b.dataset.i,
          1
        );

      sb.storage
        .from('photos')
        .remove(p);

      save();

      render();

      return;
    }


    /* =====================================================
       AFFICHER PHOTO
       ===================================================== */

    if(a==='zm'){

      $('#lb img').src=b.src;

      $('#lb').classList.add('on');

      return;
    }


    /* =====================================================
       PHOTO / CAMÉRA
       ===================================================== */

    if(
      (a==='cam'||a==='gal')&&
      t
    ){

      pick(
        t,
        a==='cam'
      );

      return;
    }


    /* =====================================================
       RAPPORT
       ===================================================== */

    if(a==='rep'){

      $('#shT').value=dRep(cur);

      $('#sh').classList.add('on');

      $('#shT').select();

      return;
    }


    /* =====================================================
       COPIER
       ===================================================== */

    if(a==='cp'){

      $('#shT').select();

      try{

        document.execCommand('copy');

        if(
          navigator.clipboard
        ){

          navigator.clipboard.writeText(
            $('#shT').value
          );

        }

      }catch(x){}

      toast('Copié');

      return;
    }


    /* =====================================================
       FERMER RAPPORT
       ===================================================== */

    if(a==='cl'){

      $('#sh').classList.remove('on');

      return;
    }


    /* =====================================================
       HISTORIQUE
       ===================================================== */

    if(a==='go'){

      cur=b.dataset.k;

      view='today';

      render();

      scrollTo(0,0);

      return;
    }


    /* =====================================================
       OUVRIR EMPLOYÉ
       ===================================================== */

    if(a==='emp'){

      await openEmp(
        b.dataset.id
      );

      return;
    }


    /* =====================================================
       OUVRIR JOURNÉE EMPLOYÉ
       ===================================================== */

    if(a==='tday'){

      teamDay=b.dataset.k;

      render();

      scrollTo(0,0);

      return;
    }


    /* =====================================================
       RETOUR ÉQUIPE
       ===================================================== */

    if(a==='back'){

      if(teamDay)
        teamDay=null;
      else
        teamSel=null;

      render();

      return;
    }


    /* =====================================================
       VALIDER JOURNÉE
       ===================================================== */

    if(a==='visa'){

      const v=
        (trev[teamDay]||{})['']||{};

      if(
        await mrev(
          '',
          {
            validated_at:
              v.validated_at
                ?null
                :new Date().toISOString()
          }
        )
      ){

        render();

      }

      return;
    }


    /* =====================================================
       CHANGER RÔLE
       ===================================================== */

    if(a==='role'){

      const r=
        await sb.rpc(
          'set_user_role',
          {
            target:b.dataset.id,
            new_role:b.dataset.r
          }
        );

      if(r.error){

        return toast(
          /function/i.test(
            r.error.message
          )
            ?'Executez schema_v2.sql dans Supabase'
            :'Erreur : '+r.error.message
        );
      }

      await loadTeam();

      render();

      toast('Rôle mis à jour');

      return;
    }


    /* =====================================================
       ENVOYER ORDRE
       ===================================================== */

    if(a==='oadd'){

      const title=$('#ot').value.trim();

      if(!title)
        return toast('Titre requis');

      if(!teamSel)
        return toast('Aucun employé sélectionné');

      const r=
        await sb
          .from('orders')
          .insert({

            employee_id:teamSel,

            day:
              $('#od').value||
              today(),

            title:title,

            note:
              $('#on').value.trim(),

            priority:
              +$('#op').value,

            created_by:
              me.id,

            manager_name:
              prof.name||''

          })
          .select()
          .single();

      if(r.error)
        return toast(
          'Erreur : '+
          r.error.message
        );

      tords.unshift(
        r.data
      );

      render();

      toast('Ordre envoyé');

      return;
    }


    /* =====================================================
       STATUT ORDRE
       ===================================================== */

    if(a==='os'){

      const v=
        +b.dataset.v;

      const r=
        await sb
          .from('orders')
          .update({

            status:v,

            done_at:
              v===2
                ?new Date().toISOString()
                :null

          })
          .eq(
            'id',
            b.dataset.id
          );

      if(r.error){

        return toast(
          'Erreur : '+
          r.error.message
        );

      }

      const o=
        ords.find(
          x=>x.id==b.dataset.id
        );

      if(o)
        o.status=v;

      /*
        IMPORTANT:
        Pas de init() ici.
        init() rechargeait toute l'application
        inutilement et pouvait provoquer des
        comportements instables.
      */

      render();

      return;
    }

  }
);

function pick(t,cam){

  const i=
    document.createElement('input');

  i.type='file';

  i.accept='image/*';

  if(cam)
    i.capture='environment';
  else
    i.multiple=true;

  i.onchange=async()=>{

    toast('Envoi de la photo...');

    for(const f of i.files){

      try{

        const bl=
          await shrink(f);

        const p=
          `${me.id}/${cur}/${t.id}-${Date.now()}.jpg`;

        const r=
          await sb
            .storage
            .from('photos')
            .upload(
              p,
              bl,
              {
                contentType:'image/jpeg'
              }
            );

        if(r.error)
          throw r.error;

        t.p.push(p);

      }catch(x){

        toast(
          'Photo : '+
          (x.message||'erreur')
        );

      }

    }

    save();

    render();
  };

  i.click();
}


/* =========================================================
   COMPRESSION IMAGE
   ========================================================= */

function shrink(f){

  return new Promise(
    (ok,no)=>{

      const r=
        new FileReader();

      r.onerror=no;

      r.onload=()=>{

        const m=
          new Image();

        m.onerror=no;

        m.onload=()=>{

          const k=
            Math.min(
              1,
              1200/
              Math.max(
                m.width,
                m.height
              )
            );

          const c=
            document.createElement(
              'canvas'
            );

          c.width=
            Math.round(
              m.width*k
            );

          c.height=
            Math.round(
              m.height*k
            );

          c
            .getContext('2d')
            .drawImage(
              m,
              0,
              0,
              c.width,
              c.height
            );

          c.toBlob(
            b=>
              b
                ?ok(b)
                :no(),
            'image/jpeg',
            .72
          );

        };

        m.src=r.result;

      };

      r.readAsDataURL(f);

    }
  );
}


/* =========================================================
   RETOUR DANS L'APPLICATION
   ========================================================= */

document.addEventListener(
  'visibilitychange',
  ()=>{

    if(
      !document.hidden&&
      me&&
      prof&&
      prof.role!=='manager'&&
      !dirty.size&&
      view!=='more'
    ){

      loadMine()
        .then(render);

    }

  }
);


/* =========================================================
   HORLOGE AUTOMATIQUE
   ========================================================= */

setInterval(
  live,
  30000
);


/* =========================================================
   DÉMARRAGE
   ========================================================= */

init();

</script>
