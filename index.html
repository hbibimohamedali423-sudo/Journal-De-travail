<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="theme-color" content="#050b18">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Journal de travail</title>

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#050b18;
  --card:#0c1a33;
  --ink:#eaf2ff;
  --mut:#8a9bb8;
  --line:#17315c;
  --nav:#050b18;
  --acc:#1e6bff;
  --ai:#fff;
  --ok:#19c37d;
  --run:#2f8bff;
  --pend:#f5a524;
  --bad:#ff5d5d;
  --amb:#f5a524;
  --adm:#2a2110;
  --al:#6b5320;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:
    radial-gradient(700px 380px at 85% -5%,rgba(30,107,255,.28),transparent 70%),
    radial-gradient(500px 300px at 0% 35%,rgba(122,92,255,.13),transparent 70%),
    #050b18;
  background-attachment:fixed;
  color:var(--ink);
  font:15px/1.55 "IBM Plex Sans",system-ui,sans-serif;
}

header{
  position:sticky;
  top:0;
  z-index:5;
  background:rgba(5,11,24,.85);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;
  display:flex;
  align-items:center;
  gap:12px;
  border-bottom:1px solid #0f2247;
}

.mono{
  width:42px;
  height:42px;
  border-radius:50%;
  background:linear-gradient(135deg,#1e6bff,#7a5cff);
  color:#fff;
  display:grid;
  place-items:center;
  font-weight:700;
  box-shadow:0 0 16px rgba(47,139,255,.5);
}

header h1{
  margin:0;
  font-size:16px;
  font-weight:600;
  line-height:1.2;
}

header .sub{
  color:var(--mut);
}

header>div:nth-child(2){
  flex:1;
  min-width:0;
}

.clk{
  font-size:18px;
  font-weight:600;
  color:#8fc0ff;
}

main{
  max-width:660px;
  margin:0 auto;
  padding:12px 14px 100px;
}

.sub{
  font-size:12.5px;
  color:var(--mut);
}

input,
select,
textarea{
  font:inherit;
  color:var(--ink);
  background:#07122a;
  border:1px solid var(--line);
  border-radius:10px;
  padding:9px 10px;
  width:100%;
}

input:focus,
select:focus,
textarea:focus{
  border-color:#2f7dff;
  outline:none;
  box-shadow:0 0 0 3px rgba(47,125,255,.25);
}

textarea{
  min-height:56px;
  resize:vertical;
  font-size:14px;
}

.adm{
  background:var(--adm);
  border:1px solid var(--al);
  border-radius:10px;
  padding:6px 10px;
  margin-top:8px;
}

.adm textarea{
  background:#07122a;
}

.sec{
  background:linear-gradient(180deg,#0e1e3d,#0a1630);
  border:1px solid var(--line);
  border-radius:16px;
  padding:14px;
  margin:12px 0;
  box-shadow:0 6px 24px rgba(0,0,0,.35);
}

.sec h2{
  font-size:12px;
  margin:0 0 10px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.9px;
  color:var(--mut);
  display:flex;
  justify-content:space-between;
  align-items:center;
}

button{
  font:inherit;
  font-weight:500;
  cursor:pointer;
  border-radius:10px;
  border:1px solid var(--line);
  background:#0b1a36;
  color:var(--ink);
  padding:10px 12px;
  transition:transform .12s;
}

button:active{
  transform:scale(.97);
}

button.p{
  background:linear-gradient(90deg,#1e6bff,#3a8dff);
  border-color:#2f7dff;
  color:#fff;
  font-weight:600;
  box-shadow:0 4px 18px rgba(30,107,255,.4);
}

button.p.big{
  width:100%;
  margin-top:10px;
  padding:13px;
}

button.d{
  color:var(--bad);
}

button.g{
  border:0;
  background:none;
  color:var(--mut);
  font-size:13px;
}

:focus-visible{
  outline:3px solid var(--amb);
  outline-offset:1px;
}

.bar{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.bar>*{
  flex:1;
  min-width:120px;
}

.hero{
  background:linear-gradient(135deg,#123a82,#0a1a3c);
  border-color:#2a5fc4;
}

.st{
  display:flex;
  align-items:center;
  gap:12px;
}

.dot{
  width:14px;
  height:14px;
  border-radius:50%;
  background:var(--mut);
}

.dot.on{
  background:var(--ok);
  box-shadow:0 0 0 5px rgba(25,195,125,.25);
}

.dot.br{
  background:var(--pend);
}

.st b{
  font-size:19px;
  display:block;
  line-height:1.2;
}

.hn{
  margin-inline-start:auto;
  font-size:26px;
  font-weight:700;
}

.tri{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.tri>div{
  background:linear-gradient(180deg,#0e1e3d,#0a1630);
  border:1px solid var(--line);
  border-radius:14px;
  padding:12px;
  text-align:center;
}

.tri b{
  display:block;
  font-size:26px;
}

.tri span{
  font-size:12px;
  color:var(--mut);
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
  text-align:center;
  margin:8px 0;
}

.grid b{
  display:block;
  font-size:17px;
}

.grid span{
  font-size:11.5px;
  color:var(--mut);
}

.pg{
  height:6px;
  background:rgba(255,255,255,.12);
  border-radius:6px;
  overflow:hidden;
  margin:8px 0;
}

.pg i{
  display:block;
  height:100%;
  background:linear-gradient(90deg,#1e6bff,#4da0ff);
  transition:width .4s;
}

.chips{
  display:flex;
  gap:6px;
  overflow-x:auto;
  padding:2px 0 6px;
}

.chips button{
  white-space:nowrap;
  padding:5px 14px;
  border-radius:20px;

}

.chips .on{
  background:linear-gradient(90deg,#1e6bff,#3a8dff);

  color:#fff;
}

.t{

  border-inline-start:4px solid var(--line);
  border-radius:12px;
  margin-top:8px;
  background:#0a1630;
}

.t.s0{
  border-inline-start-color:var(--pend);
}

.t.s1{
  border-inline-start-color:var(--run);
}

.t.s2{
  border-inline-start-color:var(--ok);
}

.th{
  display:flex;
  gap:8px;
  align-items:center;
  padding:11px;

}

.th .n{
  flex:1;
  font-weight:600;
}

.t.s2 .n{
  opacity:.6;
  text-decoration:line-through;
}

.bd{
  font-size:11.5px;
  font-weight:600;
  padding:3px 10px;
  border-radius:8px;
  white-space:nowrap;
}

.s0 .bd{
  background:rgba(245,165,36,.16);
  color:var(--pend);
}

.s1 .bd{
  background:rgba(47,139,255,.18);
  color:#6db0ff;
}

.s2 .bd{
  background:rgba(25,195,125,.16);
  color:var(--ok);
}

.pr{
  width:9px;
  height:9px;
  border-radius:50%;
  background:var(--line);
  flex:none;
}

.pr1{
  background:var(--amb);
}

.pr2{
  background:var(--bad);
}

.tb{
  display:none;
  padding:0 11px 12px;
}

.t.o .tb{
  display:block;
}

.lab{
  font-size:12.5px;
  color:var(--mut);
  margin:8px 0 3px;
}

.seg{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
}

.seg .on{
  background:linear-gradient(90deg,#1e6bff,#3a8dff);
  border-color:#2f7dff;
  color:#fff;
}

.two{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.ph{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:8px;
}

.ph div{
  position:relative;
}

.ph img{
  width:84px;
  height:84px;
  object-fit:cover;
  border-radius:10px;
  border:1px solid var(--line);
  display:block;
  background:#07122a;
}

.ph .x{
  position:absolute;
  top:3px;
  inset-inline-start:3px;
  background:rgba(0,0,0,.7);
  color:#fff;
  border:0;
  border-radius:50%;
  width:24px;
  height:24px;
  padding:0;
}

.h,
.rw{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:11px 0;
  border-bottom:1px solid #12274d;
  cursor:pointer;
}

.rw>div{
  flex:1;
  min-width:0;
}

.rw b{
  display:block;
}

.tag{
  font-size:11.5px;
  font-weight:600;
  color:var(--bad);
}

.tag.o{
  color:var(--ok);
}

.pill{
  font-size:12px;
  background:rgba(47,139,255,.18);
  color:#6db0ff;
  padding:2px 10px;
  border-radius:12px;
  text-transform:none;
  letter-spacing:0;
}

.wd{
  display:flex;
  justify-content:space-between;
  padding:0 2px;
  font-size:11px;
  color:var(--mut);
}

.dw{
  display:flex;
  align-items:center;
  gap:18px;
}

.dn{
  width:118px;
  height:118px;
  border-radius:50%;
  display:grid;
  place-items:center;
  position:relative;
  flex:none;
}

.dn::after{
  content:"";
  position:absolute;
  inset:15px;
  border-radius:50%;
  background:#0a1630;
}

.dn b{
  position:relative;
  z-index:1;
  font-size:22px;
}

.lg2{
  flex:1;
}

.lg2 div{
  display:flex;
  align-items:center;
  gap:8px;
  margin:6px 0;
  font-size:14px;
}

.lg2 i{
  width:10px;
  height:10px;
  border-radius:50%;
}

.lg2 b{
  margin-inline-start:auto;
}

.lg{
  text-align:center;
  padding:30px 0 6px;
}

.lgo{
  width:88px;
  height:88px;
  margin:0 auto 14px;
  border-radius:26px;
  background:linear-gradient(135deg,#1e6bff,#7a5cff);
  display:grid;
  place-items:center;
  font-size:32px;
  font-weight:700;
  box-shadow:0 0 44px rgba(47,139,255,.55);
}

.lg h2{
  font-size:26px;
  margin:0;
}

.lg p{
  color:var(--mut);
  margin:4px 0 0;
}

.nav{
  position:fixed;
  bottom:0;
  inset-inline:0;
  background:rgba(5,11,24,.94);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  border-top:1px solid #12274d;
  display:flex;
  padding-bottom:env(safe-area-inset-bottom,0px);
  z-index:6;
}

.nav:empty{
  display:none;
}

.nav button{
  flex:1;
  border:0;
  border-radius:0;
  padding:9px 0 8px;
  background:none;
  color:var(--mut);
  font-size:11px;
  font-weight:600;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
}

.nav .on{
  color:#4da0ff;
}

.nav .on svg{
  filter:drop-shadow(0 0 6px rgba(77,160,255,.8));
}

.ov{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.88);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:9;
  padding:12px;
}

.ov.on{
  display:flex;
}

.ov img{
  max-width:100%;
  max-height:90%;
  border-radius:10px;
}

.bx{
  background:#0a1630;
  border:1px solid var(--line);
  padding:12px;
  border-radius:14px;
  width:100%;
  max-width:600px;
}

#toast{
  position:fixed;
  bottom:84px;
  inset-inline:0;
  margin:auto;
  width:max-content;
  max-width:90%;
  background:#1e6bff;
  color:#fff;
  padding:8px 16px;
  border-radius:20px;
  opacity:0;
  transition:opacity .25s;
  z-index:10;
  pointer-events:none;
}

#toast.on{
  opacity:1;
}

.em{
  text-align:center;
  color:var(--mut);
  padding:14px;
}

.order{
  border:1px solid var(--line);
  border-radius:12px;
  background:#08152d;
  padding:11px;
  margin-top:8px;
}

.order-head{
  display:flex;
  align-items:center;
  gap:8px;
}

.order-head b{
  flex:1;
}

.order-note{
  color:var(--mut);
  font-size:13px;
  margin-top:5px;
}

.order-actions{
  display:flex;
  gap:6px;
  margin-top:9px;
}

.order-actions button{
  flex:1;
  font-size:12px;
  padding:7px;
}

.employee-card{
  display:flex;
  align-items:center;
  gap:10px;
  padding:11px 0;
  border-bottom:1px solid #12274d;
}

.employee-main{
  flex:1;
  min-width:0;
  cursor:pointer;
}

.employee-main b{
  display:block;
}

.role-btn{
  flex:none;
  font-size:11px;
  padding:7px 9px;
}

.back{
  width:100%;
  margin-bottom:10px;
}

.manager-day{
  padding:11px 0;
  border-bottom:1px solid #12274d;
  cursor:pointer;
}

.manager-day b{
  display:block;
}

@media(max-width:420px){
  .two{
    grid-template-columns:1fr;
  }

  .tri{
    gap:6px;
  }

  .tri>div{
    padding:9px 5px;
  }

  .tri b{
    font-size:22px;
  }

  .dw{
    gap:8px;
  }

  .dn{
    width:100px;
    height:100px;
  }
}
</style>
</head>

<body>

<header>
  <div class="mono" id="mn">JT</div>

  <div>
    <h1 id="ttl">Journal de travail</h1>
    <div class="sub" id="sb"></div>
  </div>

  <div class="clk" id="clk"></div>
</header>

<main id="app"></main>

<nav class="nav" id="nv"></nav>

<div class="ov" id="lb">
  <img alt="">
</div>

<div class="ov" id="sh">
  <div class="bx">
    <textarea id="shT" readonly style="min-height:240px"></textarea>

    <div class="bar" style="margin-top:8px">
      <button class="p" data-a="cp">Copier</button>
      <button data-a="cl">Fermer</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>

/* ============================================================
   SUPABASE
   ============================================================ */

const SB_URL='https://khyeypvhsumpboskcdny.supabase.co';

const SB_KEY='sb_publishable_5Hf8Zg1mauJRQRKtMSg99A_HI8vVbH2';

const $=s=>document.querySelector(s);

const sb=supabase.createClient(
  SB_URL,
  SB_KEY
);


/* ============================================================
   APPLICATION STATE
   ============================================================ */

let me=null;
let prof=null;

let days={};
let rev={};

let view='dash';
let flt=-1;

let team=[];
let teamSel=null;
let teamDay=null;

let tdays=[];
let trev={};

let ords=[];
let tords=[];

let cur=today();

const open=new Set();
const urls={};
const dirty=new Set();

let tm;
let pt;


/* ============================================================
   CONSTANTS
   ============================================================ */

const ST=[
  'Nouvelle',
  'En cours',
  'Terminée'
];

const PR=[
  'Normale',
  'Importante',
  'Urgente'
];


/* ============================================================
   DATE / TIME HELPERS
   ============================================================ */

function ds(d){
  return d.getFullYear()+
    '-'+String(d.getMonth()+1).padStart(2,'0')+
    '-'+String(d.getDate()).padStart(2,'0');
}

function today(){
  return ds(new Date());
}

function hm(t){
  return t
    ? new Date(t).toLocaleTimeString(
        'fr-FR',
        {
          hour:'2-digit',
          minute:'2-digit'
        }
      )
    : '—';
}

function dur(m){
  m=Math.max(0,Number(m)||0);

  return Math.floor(m/60)+
    ' h '+
    String(m%60).padStart(2,'0');
}


/* ============================================================
   SECURITY / DISPLAY
   ============================================================ */

function esc(s){
  return String(s??'')
    .replace(/[&<>"]/g,c=>({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;'
    }[c]));
}


/* ============================================================
   DAY DATA
   ============================================================ */

function day(k=cur){

  const d=days[k]||(days[k]={});

  d.brk=d.brk||[];
  d.tasks=d.tasks||[];
  d.loc=d.loc||'';
  d.note=d.note||'';

  return d;
}


/* ============================================================
   REVIEW
   ============================================================ */

function R(k,t=''){
  return (rev[k]&&rev[k][t])||{};
}


/* ============================================================
   TOAST
   ============================================================ */

function toast(m){

  const t=$('#toast');

  if(!t)return;

  t.textContent=m;

  t.classList.add('on');

  clearTimeout(toast.t);

  toast.t=setTimeout(
    ()=>t.classList.remove('on'),
    2200
  );
}


/* ============================================================
   WORK STATS
   ============================================================ */

function stats(d,live){

  if(!d.in){
    return {
      net:0,
      brk:0,
      late:0
    };
  }

  const end=d.out||
    (live?Date.now():d.in);

  let b=0;

  (d.brk||[]).forEach(x=>{
    b+=((x[1]||end)-x[0]);
  });

  const s=new Date(d.in);

  const start=(prof&&prof.start)||'08:00';

  const parts=start.split(':');

  s.setHours(
    Number(parts[0]),
    Number(parts[1]),
    0,
    0
  );

  return {
    net:Math.max(
      0,
      Math.round(
        (end-d.in-b)/60000
      )
    ),

    brk:Math.round(b/60000),

    late:Math.max(
      0,
      Math.round(
        (d.in-s)/60000
      )
    )
  };
}


/* ============================================================
   SAVE DAY
   ============================================================ */

function save(){

  dirty.add(cur);

  clearTimeout(tm);

  tm=setTimeout(
    flush,
    700
  );
}

async function flush(){

  if(!me)return;

  for(const k of [...dirty]){

    dirty.delete(k);

    const r=await sb
      .from('days')
      .upsert(
        {
          user_id:me.id,
          day:k,
          data:days[k],
          updated_at:new Date().toISOString()
        },
        {
          onConflict:'user_id,day'
        }
      );

    if(r.error){
      toast('Erreur : '+r.error.message);
    }
  }
}


/* ============================================================
   SAVE PROFILE
   ============================================================ */

function saveProf(){

  clearTimeout(pt);

  pt=setTimeout(
    async()=>{

      if(!me||!prof)return;

      const p=prof;

      const r=await sb
        .from('profiles')
        .update({
          name:p.name,
          matricule:p.matricule,
          job:p.job,
          dep:p.dep,
          co:p.co,
          mgr:p.mgr,
          start:p.start,
          h:p.h
        })
        .eq('id',me.id);

      if(r.error){
        toast('Erreur : '+r.error.message);
      }
    },
    700
  );
}


/* ============================================================
   GROUP REVIEWS
   ============================================================ */

function grp(rows,o){

  (rows||[]).forEach(x=>{

    (o[x.day]=o[x.day]||{})[x.task_id]=x;

  });

  return o;
}


/* ============================================================
   LOAD CURRENT USER
   ============================================================ */

async function loadMine(){

  if(!me)return;

  const a=await sb
    .from('days')
    .select('day,data')
    .eq('user_id',me.id)
    .order('day',{ascending:false})
    .limit(90);

  if(a.error){
    toast('Jours : '+a.error.message);
  }

  days={};

  (a.data||[]).forEach(x=>{
    days[x.day]=x.data;
  });


  const b=await sb
    .from('reviews')
    .select('*')
    .eq('user_id',me.id);

  if(b.error){
    toast('Validations : '+b.error.message);
  }

  rev=grp(b.data,{});


  const o=await sb
    .from('orders')
    .select('*')
    .eq('employee_id',me.id)

/* ============================================================
   ATTENDANCE ACTIONS
   ============================================================ */

function act(a){

  cur=today();

  const d=day();

  const n=Date.now();

  const ob=d.brk[d.brk.length-1];


  if(a==='in'){

    if(d.in)
      return toast(
        'Arrivée déjà enregistrée'
      );

    d.in=n;

    toast(
      'Arrivée enregistrée'
    );

  }

  else if(a==='out'){

    if(!d.in)
      return toast(
        "Enregistrez d'abord l'arrivée"
      );

    if(ob&&!ob[1])
      ob[1]=n;

    d.out=n;

    toast(
      'Départ enregistré'
    );

  }

  else if(a==='bs'){

    if(!d.in||d.out)
      return toast(
        'Pause impossible maintenant'
      );

    if(ob&&!ob[1])
      return toast(
        'Pause déjà en cours'
      );

    d.brk.push([
      n,
      null
    ]);

    toast(
      'Pause commencée'
    );

  }

  else if(a==='be'){

    if(!ob||ob[1])
      return toast(
        'Aucune pause en cours'
      );

    ob[1]=n;

    toast(
      'Retour de pause'
    );

  }

  else if(a==='re'){

    d.out=null;

    toast(
      'Journée rouverte'
    );
  }


  save();

  render();
}


/* ============================================================
   QUICK COMMAND
   ============================================================ */

function cmd(v){

  v=v.trim();

  if(!v)return;


  const k=v
    .toLowerCase()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g,'');


  const m={
    'arrivee':'in',
    'arrive':'in',
    'debut':'in',
    'depart':'out',
    'fin':'out',
    'sortie':'out',
    'pause':'bs',
    'retour':'be',
    'reprise':'be'
  };


  if(m[k])
    return act(m[k]);


  cur=today();


  const urgent=v[0]==='!';

  const title=urgent
    ? v.slice(1).trim()
    : v;


  const o={
    id:Date.now(),
    t:title,
    s:0,
    pr:urgent?2:0,
    cat:'',
    mat:'',
    n:'',
    p:[],
    st:null,
    en:null
  };


  if(!o.t)return;


  day().tasks.push(o);

  open.add(o.id);

  save();

  render();
}

/* ============================================================
   PHOTO URL HYDRATION
   ============================================================ */

async function hydrate(){

  const im=[
    ...document.querySelectorAll(
      'img[data-p]'
    )
  ];


  const need=[
    ...new Set(
      im
        .map(i=>i.dataset.p)
        .filter(p=>p&&!urls[p])
    )
  ];


  if(need.length){

    const r=
      await sb
        .storage
        .from('photos')
        .createSignedUrls(
          need,
          3600
        );


    (r.data||[]).forEach(x=>{

      if(x.signedUrl){
        urls[x.path]=x.signedUrl;
      }

    });

  }


  im.forEach(i=>{

    if(urls[i.dataset.p]){
      i.src=urls[i.dataset.p];
    }

  });
}

/* ============================================================
   HISTORY
   ============================================================ */

function rHist(){

  const ks=
    Object.keys(days)
      .filter(
        k=>
          days[k].in||
          (days[k].tasks||[]).length
      )
      .sort()
      .reverse();


  const m=
    today().slice(0,7);


  let tot=0;
  let dd=0;


  ks.forEach(k=>{

    if(k.startsWith(m)){

      const s=stats(
        days[k]
      );

      tot+=s.net;

      if(s.net)dd++;

    }

  });


  return `

  <section class="sec">

    <h2>
      Ce mois-ci
    </h2>


    <div
      class="grid"
      style="grid-template-columns:1fr 1fr"
    >

      <div>
        <b>${dur(tot)}</b>
        <span>Heures</span>
      </div>

      <div>
        <b>${dd}</b>
        <span>Jours travaillés</span>
      </div>

    </div>

  </section>


  <section class="sec">

    <h2>
      Journées
    </h2>


    ${
      ks.map(k=>{

        const d=days[k];

        const s=stats(d);

        const dn=
          d.tasks.filter(
            t=>t.s==2
          ).length;


        return `

        <div
          class="h"
          data-a="go"
          data-k="${k}"
        >

          <div>

            <b>
              ${k}
            </b>

            ${
              R(k).validated_at
              ?
              '<span class="tag o">✔ validée</span>'
              :
              ''
            }

            <div class="sub">
              ${hm(d.in)}
              →
              ${hm(d.out)}
            </div>

          </div>


          <div style="text-align:end">

            <b>
              ${dur(s.net)}
            </b>

            <div class="sub">
              ${dn}/${d.tasks.length} tâches
            </div>

          </div>

        </div>

        `;

      }).join('')

      ||

      `
      <div class="em">
        Aucune journée enregistrée.
      </div>
      `
    }

  </section>

  `;
}

/* ============================================================
   CLICK HANDLER
   ONE SINGLE GLOBAL HANDLER
   ============================================================ */

document.addEventListener(
  'click',
  async e=>{

    const b=
      e.target.closest(
        '[data-a],[data-v]'
      );


    if(!b)return;


    /* --------------------------------------------------------
       NAVIGATION
       -------------------------------------------------------- */

    if(
      b.closest('.nav') &&
      b.dataset.v
    ){

      if(!me)return;

      view=b.dataset.v;

      teamSel=null;
      teamDay=null;

      render();

      return;
    }


    if(!me){

      const a=b.dataset.a;

      /* LOGIN */

      if(a==='li'){

        const em=$('#em').value.trim();
        const pw=$('#pw').value;


        if(!em||!pw){

          return toast(
            'E-mail et mot de passe requis'
          );

        }


        const r=
          await sb.auth.signInWithPassword({
            email:em,
            password:pw
          });


        if(r.error){

          $('#msg').textContent=
            r.error.message;

          return;
        }


        await init();

        return;
      }


      /* SIGN UP */

      if(a==='su'){

        const em=$('#em').value.trim();
        const pw=$('#pw').value;
        const nm=$('#nm').value.trim();


        if(!em||!pw){

          return toast(
            'E-mail et mot de passe requis'
          );

        }


        if(pw.length<6){

          return toast(
            'Mot de passe : minimum 6 caractères'
          );

        }


        const r=
          await sb.auth.signUp({

            email:em,

            password:pw,

            options:{
              data:{
                name:nm
              }
            }

          });


        if(r.error){

          $('#msg').textContent=
            r.error.message;

          return;
        }


        $('#msg').textContent=
          r.data.session
          ?
          'Compte créé.'
          :
          'Compte créé. Vérifiez votre e-mail si nécessaire.';

        if(r.data.session){

          await init();

        }

        return;
      }

      return;
    }


    const a=b.dataset.a;


    /* --------------------------------------------------------
       ATTENDANCE
       -------------------------------------------------------- */

    if([
      'in',
      'out',
      'bs',
      'be',
      're'
    ].includes(a)){

      act(a);

      return;
    }


    /* --------------------------------------------------------
       NAVIGATION TASKS
       -------------------------------------------------------- */

    if(a==='gt'){

      view='today';

      render();

      return;
    }


    if(a==='td'){

      cur=today();

      flt=-1;

      render();

      return;
    }


    if(a==='fl'){

      flt=Number(
        b.dataset.v
      );

      render();

      return;
    }


    if(a==='go'){

      cur=b.dataset.k;

      view='today';

      flt=-1;

      render();

      return;
    }


    /* --------------------------------------------------------
       QUICK COMMAND
       -------------------------------------------------------- */

    if(a==='rep'){

      const d=day();

      const s=
        stats(
          d,
          false
        );


      const lines=[

        'RAPPORT DE TRAVAIL',

        'Date : '+cur,

        '',

        'Arrivée : '+hm(d.in),

        'Départ : '+hm(d.out),

        'Pause : '+s.brk+' min',

        'Temps net : '+dur(s.net),

        'Lieu : '+(d.loc||'—'),

        '',

        'TÂCHES :',

        ...(d.tasks||[]).map(
          (t,i)=>
            `${i+1}. ${t.t} — ${ST[t.s]}`
        ),

        '',

        'NOTE :',

        d.note||'—'

      ];


      $('#shT').value=
        lines.join('\n');

      $('#sh').classList.add('on');

      return;
    }


    if(a==='cp'){

      try{

        await navigator.clipboard.writeText(
          $('#shT').value
        );

        toast(
          'Rapport copié'
        );

      }catch{

        $('#shT').select();

        document.execCommand(
          'copy'
        );

        toast(
          'Rapport copié'
        );

      }

      return;
    }


    if(a==='cl'){

      $('#sh').classList.remove('on');

      return;
    }


    /* --------------------------------------------------------
       TASK OPEN / CLOSE
       -------------------------------------------------------- */

    if(a==='tg'){

      const box=
        b.closest('.t');

      if(!box)return;

      const id=
        Number(box.dataset.id);

      if(open.has(id))
        open.delete(id);
      else
        open.add(id);

      render();

      return;
    }


    /* --------------------------------------------------------
       TASK STATUS
       -------------------------------------------------------- */

    if(a==='set'){

      const box=
        b.closest('.t');

      if(!box)return;

      const id=
        Number(box.dataset.id);

      const t=
        day().tasks.find(
          x=>Number(x.id)===id
        );

      if(!t)return;


      const v=
        Number(b.dataset.v);


      t.s=v;


      if(v===1&&!t.st){

        t.st=Date.now();

      }


      if(v===2){

        if(!t.st)
          t.st=Date.now();

        t.en=Date.now();

      }


      if(v<2){

        t.en=null;

      }


      save();

      render();

      return;
    }


    /* --------------------------------------------------------
       TASK DELETE
       -------------------------------------------------------- */

    if(a==='del'){

      const box=
        b.closest('.t');

      if(!box)return;

      const id=
        Number(box.dataset.id);


      const d=day();


      d.tasks=
        d.tasks.filter(
          x=>Number(x.id)!==id
        );


      open.delete(id);

      save();

      render();

      toast(
        'Tâche supprimée'
      );

      return;
    }


    /* --------------------------------------------------------
       REMOVE PHOTO
       -------------------------------------------------------- */

    if(a==='rp'){

      const box=
        b.closest('.t');

      if(!box)return;

      const id=
        Number(box.dataset.id);

      const i=
        Number(b.dataset.i);


      const t=
        day().tasks.find(
          x=>Number(x.id)===id
        );


      if(!t)return;


      t.p.splice(i,1);

      save();

      render();

      return;
    }


    /* --------------------------------------------------------
       IMAGE ZOOM
       -------------------------------------------------------- */

    if(a==='zm'){

      const src=
        b.src;

      if(!src)return;

      $('#lb img').src=src;

      $('#lb').classList.add('on');

      return;
    }


    /* --------------------------------------------------------
       PHOTO CAMERA
       -------------------------------------------------------- */

    if(a==='cam'||a==='gal'){

      const box=
        b.closest('.t');

      if(!box)return;

      const id=
        Number(box.dataset.id);

      const input=
        document.createElement('input');

      input.type='file';

      input.accept='image/*';

      if(a==='cam')
        input.capture='environment';

      input.onchange=
        async()=>{

          const file=
            input.files[0];

          if(!file)return;


          const t=
            day().tasks.find(
              x=>Number(x.id)===id
            );

          if(!t)return;


          const path=
            `${me.id}/${cur}/${id}-${Date.now()}.jpg`;


          const r=
            await sb.storage
              .from('photos')
              .upload(
                path,
                file,
                {
                  contentType:
                    file.type||
                    'image/jpeg',
                  upsert:false
                }
              );


          if(r.error){

            toast(
              'Photo : '+
              r.error.message
            );

            return;
          }


          t.p=t.p||[];

          t.p.push(path);

          save();

          render();

          toast(
            'Photo enregistrée'
          );

        };


      input.click();

      return;
    }


    /* --------------------------------------------------------
       EMPLOYEE PROFILE INPUTS
       -------------------------------------------------------- */

    if(b.dataset.s){

      return;
    }


    /* --------------------------------------------------------
       LOGOUT
       -------------------------------------------------------- */

    if(a==='lo'){

      await sb.auth.signOut();

      me=null;
      prof=null;
      days={};
      rev={};
      team=[];
      ords=[];
      tords=[];
      teamSel=null;
      teamDay=null;
      view='dash';

      render();

      return;
    }


    /* --------------------------------------------------------
       REFRESH
       -------------------------------------------------------- */

    if(a==='rf'){

      if(prof.role==='manager'){

        await loadTeam();

      }else{

        await loadMine();

      }

      render();

      toast(
        'Actualisé'
      );

      return;
    }


    /* --------------------------------------------------------
       MANAGER : OPEN EMPLOYEE
       -------------------------------------------------------- */

    if(a==='emp'){

      await openEmp(
        b.dataset.id
      );

      return;
    }


    /* --------------------------------------------------------
       MANAGER : BACK TEAM
       -------------------------------------------------------- */

    if(a==='backteam'){

      teamSel=null;
      teamDay=null;

      render();

      return;
    }


    /* --------------------------------------------------------
       MANAGER : OPEN DAY
       -------------------------------------------------------- */

    if(a==='md'){

      teamDay=
        b.dataset.k;

      render();

      return;
    }


    /* --------------------------------------------------------
       MANAGER : BACK DAY
       -------------------------------------------------------- */

    if(a==='backday'){

      teamDay=null;

      render();

      return;
    }


    /* --------------------------------------------------------
       MANAGER : CHANGE ROLE
       -------------------------------------------------------- */

    if(a==='role'){

      const target=
        b.dataset.id;

      const newRole=
        b.dataset.r;


      if(!target||!newRole)
        return;


      if(
        !confirm(
          newRole==='manager'
          ?
          'Nommer cet utilisateur comme responsable ?'
          :
          'Retirer le rôle de responsable ?'
        )
      ){

        return;
      }


      const r=
        await sb.rpc(
          'set_user_role',
          {
            target:target,
            new_role:newRole
          }
        );


      if(r.error){

        toast(
          'Erreur rôle : '+
          r.error.message
        );

        return;
      }


      await loadTeam();

      render();

      toast(
        newRole==='manager'
        ?
        'Responsable nommé'
        :
        'Rôle retiré'
      );

      return;
    }


    /* --------------------------------------------------------
       MANAGER : ADD ORDER
       -------------------------------------------------------- */

    if(a==='oadd'){

      if(!teamSel)
        return;


      const title=
        ($('#ot')?.value||'')
        .trim();

      const note=
        ($('#on')?.value||'')
        .trim();

      const orderDay=
        $('#od')?.value||
        today();

      const priority=
        Number(
          $('#op')?.value||0
        );


      if(!title){

        toast(
          'Titre de l’ordre obligatoire'
        );

        return;
      }


      const r=
        await sb
          .from('orders')
          .insert({
            employee_id:teamSel,
            created_by:me.id,
            day:orderDay,
            title:title,
            note:note,
            priority:priority,
            status:0,
            manager_name:prof.name||''
          })
          .select()
          .single();


      if(r.error){

        toast(
          'Erreur ordre : '+
          r.error.message
        );

        return;
      }


      tords.unshift(
        r.data
      );


      render();

      toast(
        'Ordre envoyé'
      );

      return;
    }


    /* --------------------------------------------------------
       EMPLOYEE : ORDER STATUS
       -------------------------------------------------------- */

    if(a==='os'){

      const id=
        b.dataset.id;

      const v=
        Number(
          b.dataset.v
        );


      const patch={
        status:v,
        done_at:
          v===2
          ?
          new Date().toISOString()
          :
          null
      };


      const r=
        await sb
          .from('orders')
          .update(patch)
          .eq('id',id)
          .eq('employee_id',me.id);


      if(r.error){

        toast(
          'Erreur ordre : '+
          r.error.message
        );

        return;
      }


      const o=
        ords.find(
          x=>String(x.id)===String(id)
        );


      if(o){

        o.status=v;
        o.done_at=patch.done_at;

      }


      render();

      toast(
        v===2
        ?
        'Ordre terminé'
        :
        'Ordre commencé'
      );

      return;
    }


    /* --------------------------------------------------------
       MANAGER : VALIDATE DAY
       -------------------------------------------------------- */

    if(a==='vr'){

      if(!teamSel||!teamDay)
        return;


      const note=
        ($('#rvn')?.value||'')
        .trim();


      const r=
        await sb
          .from('reviews')
          .upsert(
            {
              user_id:teamSel,
              day:teamDay,
              task_id:'',
              note:note,
              manager_name:prof.name||'Responsable',
              validated_at:new Date().toISOString()
            },
            {
              onConflict:
                'user_id,day,task_id'
            }
          );


      if(r.error){

        toast(
          'Erreur validation : '+
          r.error.message
        );

        return;
      }


      trev[teamDay]=trev[teamDay]||{};


      trev[teamDay]['']={
        note:note,
        manager_name:prof.name||'Responsable',
        validated_at:new Date().toISOString()
      };


      render();

      toast(
        'Journée validée'
      );

      return;
    }

  }
);


/* ============================================================
   INPUT EVENTS
   ============================================================ */

document.addEventListener(
  'input',
  e=>{

    const el=e.target;


    /* --------------------------------------------------------
       DAY FIELDS
       -------------------------------------------------------- */

    if(el.matches('[data-d]')){

      const k=
        el.dataset.d;


      day()[k]=el.value;

      save();

      return;
    }


    /* --------------------------------------------------------
       PROFILE FIELDS
       -------------------------------------------------------- */

    if(el.matches('[data-s]')){

      if(!prof)return;

      const k=
        el.dataset.s;


      prof[k]=
        el.type==='number'
        ?
        Number(el.value)
        :
        el.value;


      saveProf();

      return;
    }


    /* --------------------------------------------------------
       TASK TEXT FIELDS
       -------------------------------------------------------- */

    if(
      el.matches(
        '.t [data-f]'
      )
    ){

      const box=
        el.closest('.t');

      if(!box)return;


      const id=
        Number(
          box.dataset.id
        );


      const t=
        day().tasks.find(
          x=>Number(x.id)===id
        );


      if(!t)return;


      const k=
        el.dataset.f;


      t[k]=
        el.value;


      save();

    }

  }
);


/* ============================================================
   CHANGE EVENTS
   ============================================================ */

document.addEventListener(
  'change',
  e=>{

    const el=e.target;


    /* DATE */

    if(el.id==='dt'){

      if(!el.value)return;

      cur=el.value;

      flt=-1;

      render();

      return;
    }


    /* TASK SELECT */

    if(
      el.matches(
        '.t [data-f]'
      )
    ){

      const box=
        el.closest('.t');

      if(!box)return;


      const id=
        Number(
          box.dataset.id
        );


      const t=
        day().tasks.find(
          x=>Number(x.id)===id
        );


      if(!t)return;


      const k=
        el.dataset.f;


      t[k]=
        k==='pr'
        ?
        Number(el.value)
        :
        el.value;


      save();

      render();

    }

  }
);


/* ============================================================
   KEYBOARD COMMAND
   ============================================================ */

document.addEventListener(
  'keydown',
  e=>{

    if(
      e.key!=='Enter'||
      e.shiftKey
    ){

      return;
    }


    if(
      e.target.id==='cmd'
    ){

      e.preventDefault();

      cmd(
        e.target.value
      );

      return;
    }

  }
);


/* ============================================================
   CLOSE IMAGE OVERLAY
   ============================================================ */

$('#lb').addEventListener(
  'click',
  ()=>{
    $('#lb').classList.remove('on');
  }
);


/* ============================================================
   CLOSE SHARE OVERLAY
   ============================================================ */

$('#sh').addEventListener(
  'click',
  e=>{

    if(e.target.id==='sh'){
      $('#sh').classList.remove('on');
    }

  }
);


/* ============================================================
   AUTH STATE
   ============================================================ */

sb.auth.onAuthStateChange(
  async(event,session)=>{

    if(event==='SIGNED_OUT'){

      me=null;
      prof=null;
      days={};
      rev={};
      team=[];
      ords=[];
      tords=[];
      teamSel=null;
      teamDay=null;

      render();

      return;
    }


    if(
      event==='SIGNED_IN' &&
      session
    ){

      await init();

    }

  }
);


/* ============================================================
   VISIBILITY
   ============================================================ */

document.addEventListener(
  'visibilitychange',
  async()=>{

    if(
      document.visibilityState!=='visible'||
      !me
    ){

      return;
    }


    if(
      prof&&
      prof.role==='manager'
    ){

      await loadTeam();

    }else{

      await loadMine();

    }


    render();

  }
);


/* ============================================================
   CLOCK
   ============================================================ */

setInterval(
  ()=>{

    if(me){

      live();

    }

  },
  30000
);


/* ============================================================
   START
   ============================================================ */

init();

</script>

</body>
</html>
