<html lang="fr" dir="ltr">
<head>

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{--bg:#050b18;--card:#0c1a33;--ink:#eaf2ff;--mut:#8a9bb8;--line:#17315c;--nav:#050b18;--acc:#1e6bff;--ai:#fff;--ok:#19c37d;--run:#2f8bff;--pend:#f5a524;--bad:#ff5d5d;--amb:#f5a524;--adm:#2a2110;--al:#6b5320}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(700px 380px at 85% -5%,rgba(30,107,255,.28),transparent 70%),radial-gradient(500px 300px at 0% 35%,rgba(122,92,255,.13),transparent 70%),#050b18;background-attachment:fixed;color:var(--ink);font:15px/1.55 "IBM Plex Sans",system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:rgba(5,11,24,.85);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #0f2247}
.mono{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#1e6bff,#7a5cff);color:#fff;display:grid;place-items:center;font-weight:700;box-shadow:0 0 16px rgba(47,139,255,.5)}
header h1{margin:0;font-size:16px;font-weight:600;line-height:1.2}header .sub{color:var(--mut)}header>div:nth-child(2){flex:1;min-width:0}.clk{font-size:18px;font-weight:600;color:#8fc0ff}
main{max-width:660px;margin:0 auto;padding:12px 14px 100px}
.sub{font-size:12.5px;color:var(--mut)}
input,select,textarea{font:inherit;color:var(--ink);background:#07122a;border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%}
input:focus,select:focus,textarea:focus{border-color:#2f7dff;outline:none;box-shadow:0 0 0 3px rgba(47,125,255,.25)}
textarea{min-height:56px;resize:vertical;font-size:14px}
.adm{background:var(--adm);border:1px solid var(--al);border-radius:10px;padding:6px 10px;margin-top:8px}.adm textarea{background:#07122a}
.sec{background:linear-gradient(180deg,#0e1e3d,#0a1630);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0;box-shadow:0 6px 24px rgba(0,0,0,.35)}
.sec h2{font-size:12px;margin:0 0 10px;font-weight:700;text-transform:uppercase;letter-spacing:.9px;color:var(--mut);display:flex;justify-content:space-between;align-items:center}
button{font:inherit;font-weight:500;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:#0b1a36;color:var(--ink);padding:10px 12px;transition:transform .12s}
button:active{transform:scale(.97)}
button.p{background:linear-gradient(90deg,#1e6bff,#3a8dff);border-color:#2f7dff;color:#fff;font-weight:600;box-shadow:0 4px 18px rgba(30,107,255,.4)}
button.p.big{width:100%;margin-top:10px;padding:13px}
button.d{color:var(--bad)}button.g{border:0;background:none;color:var(--mut);font-size:13px}
:focus-visible{outline:3px solid var(--amb);outline-offset:1px}
.bar{display:flex;gap:8px;flex-wrap:wrap}.bar>*{flex:1;min-width:120px}
.hero{background:linear-gradient(135deg,#123a82,#0a1a3c);border-color:#2a5fc4}
.st{display:flex;align-items:center;gap:12px}.dot{width:14px;height:14px;border-radius:50%;background:var(--mut)}.dot.on{background:var(--ok);box-shadow:0 0 0 5px rgba(25,195,125,.25)}.dot.br{background:var(--pend)}
.st b{font-size:19px;display:block;line-height:1.2}.hn{margin-inline-start:auto;font-size:26px;font-weight:700}
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.tri>div{background:linear-gradient(180deg,#0e1e3d,#0a1630);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}.tri b{display:block;font-size:26px}.tri span{font-size:12px;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;margin:8px 0}.grid b{display:block;font-size:17px}.grid span{font-size:11.5px;color:var(--mut)}
.pg{height:6px;background:rgba(255,255,255,.12);border-radius:6px;overflow:hidden;margin:8px 0}.pg i{display:block;height:100%;background:linear-gradient(90deg,#1e6bff,#4da0ff);transition:width .4s}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px}.chips button{white-space:nowrap;padding:5px 14px;border-radius:20px;font-size:13px}.chips .on{background:linear-gradient(90deg,#1e6bff,#3a8dff);border-color:#2f7dff;color:#fff}
.t{border:1px solid var(--line);border-inline-start:4px solid var(--line);border-radius:12px;margin-top:8px;background:#0a1630}.t.s0{border-inline-start-color:var(--pend)}.t.s1{border-inline-start-color:var(--run)}.t.s2{border-inline-start-color:var(--ok)}
.th{display:flex;gap:8px;align-items:center;padding:11px;cursor:pointer}.th .n{flex:1;font-weight:600}.t.s2 .n{opacity:.6;text-decoration:line-through}
.bd{font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:8px;white-space:nowrap}
.s0 .bd{background:rgba(245,165,36,.16);color:var(--pend)}.s1 .bd{background:rgba(47,139,255,.18);color:#6db0ff}.s2 .bd{background:rgba(25,195,125,.16);color:var(--ok)}
.pr{width:9px;height:9px;border-radius:50%;background:var(--line);flex:none}.pr1{background:var(--amb)}.pr2{background:var(--bad)}
.tb{display:none;padding:0 11px 12px}.t.o .tb{display:block}
.lab{font-size:12.5px;color:var(--mut);margin:8px 0 3px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.seg .on{background:linear-gradient(90deg,#1e6bff,#3a8dff);border-color:#2f7dff;color:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ph{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.ph div{position:relative}.ph img{width:84px;height:84px;object-fit:cover;border-radius:10px;border:1px solid var(--line);display:block;background:#07122a}
.ph .x{position:absolute;top:3px;inset-inline-start:3px;background:rgba(0,0,0,.7);color:#fff;border:0;border-radius:50%;width:24px;height:24px;padding:0}
.h,.rw{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #12274d;cursor:pointer}
.rw>div{flex:1;min-width:0}.rw b{display:block}
.tag{font-size:11.5px;font-weight:600;color:var(--bad)}.tag.o{color:var(--ok)}
.pill{font-size:12px;background:rgba(47,139,255,.18);color:#6db0ff;padding:2px 10px;border-radius:12px;text-transform:none;letter-spacing:0}
.wd{display:flex;justify-content:space-between;padding:0 2px;font-size:11px;color:var(--mut)}
.dw{display:flex;align-items:center;gap:18px}.dn{width:118px;height:118px;border-radius:50%;display:grid;place-items:center;position:relative;flex:none}
.dn::after{content:"";position:absolute;inset:15px;border-radius:50%;background:#0a1630}.dn b{position:relative;z-index:1;font-size:22px}
.lg2{flex:1}.lg2 div{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:14px}.lg2 i{width:10px;height:10px;border-radius:50%}.lg2 b{margin-inline-start:auto}
.lg{text-align:center;padding:30px 0 6px}.lgo{width:88px;height:88px;margin:0 auto 14px;border-radius:26px;background:linear-gradient(135deg,#1e6bff,#7a5cff);display:grid;place-items:center;font-size:32px;font-weight:700;box-shadow:0 0 44px rgba(47,139,255,.55)}.lg h2{font-size:26px;margin:0}.lg p{color:var(--mut);margin:4px 0 0}
.nav{position:fixed;bottom:0;inset-inline:0;background:rgba(5,11,24,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid #12274d;display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}.nav:empty{display:none}
.nav button{flex:1;border:0;border-radius:0;padding:9px 0 8px;background:none;color:var(--mut);font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px}
.nav .on{color:#4da0ff}.nav .on svg{filter:drop-shadow(0 0 6px rgba(77,160,255,.8))}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;z-index:9;padding:12px}.ov.on{display:flex}
.ov img{max-width:100%;max-height:90%;border-radius:10px}.bx{background:#0a1630;border:1px solid var(--line);padding:12px;border-radius:14px;width:100%;max-width:600px}
#toast{position:fixed;bottom:84px;inset-inline:0;margin:auto;width:max-content;max-width:90%;background:#1e6bff;color:#fff;padding:8px 16px;border-radius:20px;opacity:0;transition:opacity .25s;z-index:10;pointer-events:none}#toast.on{opacity:1}
.em{text-align:center;color:var(--mut);padding:14px}
</style>
</head>

<body>

<header>
  <div class="mono" id="mn">JT</div>
  <div>
    <h1 id="ttl">Journal de travail</h1>
    <div class="sub" id="sb"></div>
  </div>
  <div class="clk" id="clk"></div>
</header>

<main id="app"></main>

<nav class="nav" id="nv"></nav>

<div class="ov" id="lb">
  <img alt="">
</div>

<div class="ov" id="sh">
  <div class="bx">
    <textarea id="shT" readonly style="min-height:240px"></textarea>
    <div class="bar" style="margin-top:8px">
      <button class="p" data-a="cp">Copier</button>
      <button data-a="cl">Fermer</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const SB_URL='https://khyeypvhsumpboskcdny.supabase.co';
const SB_KEY='sb_publishable_5Hf8Zg1mauJRQRKtMSg99A_HI8vVbH2';

const $=s=>document.querySelector(s);
const sb=supabase.createClient(SB_URL,SB_KEY);

let me=null;
let prof=null;
let days={};
let rev={};
let view='dash';
let flt=-1;

let team=[];
let teamSel=null;
let teamDay=null;
let tdays=[];
let trev={};

let ords=[];
let tords=[];

const ds=d=>{
  return d.getFullYear()+'-'+
    String(d.getMonth()+1).padStart(2,'0')+'-'+
    String(d.getDate()).padStart(2,'0');
};

const today=()=>ds(new Date());
let cur=today();

const open=new Set();
const urls={};
const dirty=new Set();
const mt={};

const ST=['Nouvelle','En cours','Terminée'];
const PR=['Normale','Importante','Urgente'];

const hm=t=>{
  if(!t)return '—';
  return new Date(t).toLocaleTimeString('fr-FR',{
    hour:'2-digit',
    minute:'2-digit'
  });
};

const dur=m=>{
  m=Math.max(0,Number(m)||0);
  return Math.floor(m/60)+' h '+String(m%60).padStart(2,'0');
};

const esc=s=>{
  return String(s??'').replace(/[&<>"]/g,c=>({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;'
  }[c]));
};

const day=(k=cur)=>{
  const d=days[k]||(days[k]={});
  d.brk=d.brk||[];
  d.tasks=d.tasks||[];
  d.loc=d.loc||'';
  d.note=d.note||'';
  return d;
};

const R=(k,t='')=>(rev[k]&&rev[k][t])||{};

function toast(m){
  const x=$('#toast');
  if(!x)return;
  x.textContent=m;
  x.classList.add('on');
  clearTimeout(window.__toast);
  window.__toast=setTimeout(()=>x.classList.remove('on'),2400);
}

function stats(d,live=false,startOverride){
  let inAt=d.inAt||null;
  let outAt=d.outAt||null;

  let total=0;

  if(inAt){
    const end=outAt?new Date(outAt):new Date();
    total=Math.max(
      0,
      Math.floor((end-new Date(inAt))/60000)
    );
  }

  const breaks=(d.brk||[]).reduce((a,b)=>{
    if(b.s&&b.e){
      return a+Math.max(
        0,
        Math.floor((new Date(b.e)-new Date(b.s))/60000)
      );
    }
    return a;
  },0);

  const work=Math.max(0,total-breaks);

  const done=(d.tasks||[]).filter(t=>Number(t.s)===2).length;
  const all=(d.tasks||[]).length;

  return {
    total,
    breaks,
    work,
    done,
    all,
    pct:all?Math.round(done/all*100):0
  };
}

async function save(k=cur){
  dirty.add(k);

  clearTimeout(mt[k]);

  mt[k]=setTimeout(async()=>{
    await flush(k);
  },500);
}

async function flush(k){
  if(!me||!days[k])return;

  const payload={
    user_id:me.id,
    day:k,
    data:days[k],
    updated_at:new Date().toISOString()
  };

  const r=await sb
    .from('days')
    .upsert(payload,{onConflict:'user_id,day'});

  if(r.error){
    toast('Erreur sauvegarde: '+r.error.message);
    return;
  }

  dirty.delete(k);
}

async function saveProf(){
  if(!me||!prof)return;

  const payload={
    name:prof.name||'',
    matricule:prof.matricule||'',
    job:prof.job||'',
    dep:prof.dep||'',
    co:prof.co||'',
    mgr:prof.mgr||'',
    start:prof.start||'08:00',
    h:Number(prof.h)||8
  };

  const r=await sb
    .from('profiles')
    .update(payload)
    .eq('id',me.id);

  if(r.error){
    toast('Erreur profil: '+r.error.message);
  }
}

function grp(arr,key){
  const o={};

  (arr||[]).forEach(x=>{
    const k=x[key];
    if(!o[k])o[k]=[];
    o[k].push(x);
  });

  return o;
}

async function loadMine(){
  if(!me)return;

  const d=await sb
    .from('days')
    .select('*')
    .eq('user_id',me.id)
    .order('day',{ascending:false})
    .limit(120);

  if(d.error){
    toast('Erreur chargement des journées');
    return;
  }

  days={};

  (d.data||[]).forEach(x=>{
    days[x.day]=x.data||{};
  });

  const r=await sb
    .from('reviews')
    .select('*')
    .eq('user_id',me.id)
    .order('day',{ascending:false})
    .limit(500);

  if(r.error){
    toast('Erreur chargement des validations');
    rev={};
  }else{
    rev=grp(r.data||[],'day');
    Object.keys(rev).forEach(k=>{
      rev[k]=grp(rev[k],'task_id');
      Object.keys(rev[k]).forEach(t=>{
        rev[k][t]=rev[k][t][0]||{};
      });
    });
  }

  const o=await sb
    .from('orders')
    .select('*')
    .eq('employee_id',me.id)
    .order('created_at',{ascending:false})
    .limit(100);

  if(o.error){
    ords=[];
  }else{
    ords=o.data||[];
  }
}

async function loadTeam(){
  if(!me)return;

  const r=await sb
    .from('profiles')
    .select('*')
    .order('name',{ascending:true});

  if(r.error){
    toast('Erreur chargement équipe');
    team=[];
    return;
  }

  team=(r.data||[]).filter(x=>x.id!==me.id);
}

async function openEmp(id){
  teamSel=id;
  teamDay=null;
  tdays=[];
  trev={};
  tords=[];

  const d=await sb
    .from('days')
    .select('*')
    .eq('user_id',id)
    .order('day',{ascending:false})
    .limit(120);

  if(d.error){
    toast('Erreur chargement salarié');
    return;
  }

  tdays=d.data||[];

  const r=await sb
    .from('reviews')
    .select('*')
    .eq('user_id',id)
    .order('day',{ascending:false})
    .limit(500);

  if(!r.error){
    const a=r.data||[];

    a.forEach(x=>{
      if(!trev[x.day])trev[x.day]={};
      trev[x.day][x.task_id||'']=x;
    });
  }

  const o=await sb
    .from('orders')
    .select('*')
    .eq('employee_id',id)
    .order('created_at',{ascending:false})
    .limit(100);

  if(!o.error){
    tords=o.data||[];
  }

  render();
}

async function init(){
  const s=await sb.auth.getSession();

  me=s.data.session?.user||null;

  if(!me){
    prof=null;
    days={};
    rev={};
    team=[];
    teamSel=null;
    teamDay=null;
    ords=[];
    tords=[];
    render();
    return;
  }

  const p=await sb
    .from('profiles')
    .select('*')
    .eq('id',me.id)
    .maybeSingle();

  if(p.error){
    toast('Erreur profil: '+p.error.message);
    prof=null;
  }else{
    prof=p.data;
  }

  if(!prof){
    const ins=await sb
      .from('profiles')
      .insert({
        id:me.id,
        name:me.user_metadata?.name||'',
        role:'employee'
      })
      .select()
      .single();

    if(!ins.error){
      prof=ins.data;
    }
  }

  if(!prof){
    prof={
      id:me.id,
      name:me.user_metadata?.name||'',
      role:'employee',
      start:'08:00',
      h:8
    };
  }

  if(prof.role==='manager'){
    await loadTeam();
    if(view!=='more'&&view!=='team')view='team';
  }else{
    teamSel=null;
    teamDay=null;
    await loadMine();

    if(view==='team')view='dash';
  }

  render();
}

function navIcon(name){
  const icons={
    dash:'⌂',
    today:'✓',
    hist:'▣',
    team:'♟',
    more:'☰'
  };

  return icons[name]||'•';
}

function btns(){
  const manager=prof?.role==='manager';

  const arr=manager
    ? [
        ['team','Équipe'],
        ['more','Plus']
      ]
    : [
        ['dash','Accueil'],
        ['today',"Aujourd'hui"],
        ['hist','Historique'],
        ['more','Plus']
      ];

  return arr.map(([v,t])=>{
    return `
      <button class="${view===v?'on':''}" data-v="${v}">
        <span style="font-size:18px">${navIcon(v)}</span>
        <span>${t}</span>
      </button>
    `;
  }).join('');
}

function render(){
  const nav=$('#nv');
  const app=$('#app');

  if(!me){
    $('#mn').textContent='JT';
    $('#ttl').textContent='Journal de travail';
    $('#sb').textContent='';
    nav.innerHTML='';
    app.innerHTML=rLogin();
    live();
    return;
  }

  const name=prof?.name||me.email?.split('@')[0]||'Utilisateur';
  const initials=name
    .split(/\s+/)
    .filter(Boolean)
    .slice(0,2)
    .map(x=>x[0])
    .join('')
    .toUpperCase()||'JT';

  $('#mn').textContent=initials;

  if(prof?.role==='manager'){
    $('#ttl').textContent='Journal de travail';
    $('#sb').textContent='Responsable · '+name;
  }else{
    $('#ttl').textContent='Journal de travail';
    $('#sb').textContent=name;
  }

  nav.innerHTML=btns();

  if(prof?.role==='manager'){
    if(view==='team'){
      app.innerHTML=rTeam();
    }else{
      app.innerHTML=rMore();
    }
  }else{
    if(view==='dash'){
      app.innerHTML=rDash();
    }else if(view==='today'){
      app.innerHTML=rToday();
    }else if(view==='hist'){
      app.innerHTML=rHist();
    }else{
      app.innerHTML=rMore();
    }
  }

  live();
  setTimeout(hydrate,0);
}

function live(){
  const now=new Date();

  $('#clk').textContent=now.toLocaleTimeString('fr-FR',{
    hour:'2-digit',
    minute:'2-digit'
  });

  if(!me)return;

  const d=day(cur);
  const st=stats(
    d,
    cur===today(),
    prof?.start||'08:00'
  );

  const liveEl=$('#liveWork');

  if(liveEl){
    liveEl.textContent=dur(st.work);
  }

  const statusEl=$('#liveStatus');

  if(statusEl){
    statusEl.textContent=d.outAt
      ? 'Journée terminée'
      : d.inAt
        ? 'Présent'
        : 'Non commencé';
  }
}

async function hydrate(){
  const imgs=[...document.querySelectorAll('img[data-photo]')];

  for(const img of imgs){
    const path=img.dataset.photo;

    if(!path)continue;

    if(urls[path]){
      img.src=urls[path];
      continue;
    }

    const r=await sb.storage
      .from('photos')
      .createSignedUrl(path,3600);

    if(!r.error&&r.data?.signedUrl){
      urls[path]=r.data.signedUrl;
      img.src=r.data.signedUrl;
    }
  }
}

function rLogin(){
  return `
    <section class="lg">
      <div class="lgo">JT</div>
      <h2>Journal</h2>
      <p>Suivi de présence et des tâches</p>
    </section>

    <section class="sec">
      <h2>Connexion</h2>

      <div class="lab">Email</div>
      <input id="em" type="email" autocomplete="username">

      <div class="lab">Mot de passe</div>
      <input id="pw" type="password" autocomplete="current-password">

function buildReport(){
  const d=day(cur);
  const s=stats(d,false);

  const lines=[];

  lines.push('JOURNAL DE TRAVAIL');
  lines.push('==================');
  lines.push('');
  lines.push('Employé : '+(prof?.name||''));
  lines.push('Matricule : '+(prof?.matricule||''));
  lines.push('Date : '+cur);
  lines.push('');

  lines.push('PRÉSENCE');
  lines.push('Entrée : '+hm(d.inAt));
  lines.push('Sortie : '+hm(d.outAt));
  lines.push('Temps travaillé : '+dur(s.work));
  lines.push('Pause : '+dur(s.breaks));
  lines.push('');

  if(d.loc){
    lines.push('Lieu : '+d.loc);
    lines.push('');
  }

  lines.push('TÂCHES');
  lines.push('------');

  (d.tasks||[]).forEach((t,i)=>{
    lines.push(
      `${i+1}. ${t.n||'Sans titre'} — ${ST[Number(t.s)||0]}`
    );

    if(t.cat)lines.push('   Catégorie : '+t.cat);
    if(t.mat)lines.push('   Référence : '+t.mat);
    if(t.note)lines.push('   Note : '+t.note);

    lines.push(
      '   Début : '+hm(t.st)+' · Fin : '+hm(t.en)
    );
  });

  if(!(d.tasks||[]).length){
    lines.push('Aucune tâche.');
  }

  lines.push('');

  if(d.note){
    lines.push('REMARQUE');
    lines.push('--------');
    lines.push(d.note);
    lines.push('');
  }

  const rv=R(cur,'');

  if(rv.validated_at){
    lines.push('VALIDATION');
    lines.push('----------');
    lines.push(
      'Validée par : '+(rv.manager_name||'Responsable')
    );
    lines.push(
      'Date : '+new Date(rv.validated_at).toLocaleString('fr-FR')
    );

    if(rv.note){
      lines.push('Commentaire : '+rv.note);
    }
  }

  return lines.join('\n');
}

function pickPhoto(id,capture=false){
  const input=document.createElement('input');

  input.type='file';
  input.accept='image/*';
  input.multiple=true;

  if(capture){
    input.capture='environment';
  }

  input.onchange=async()=>{
    const files=[...(input.files||[])];

    if(!files.length)return;

    for(const file of files){
      await uploadPhoto(id,file);
    }

    render();
  };

  input.click();
}

async function uploadPhoto(taskId,file){
  if(!me)return;

  const d=day(cur);
  const t=(d.tasks||[]).find(x=>String(x.id)===String(taskId));

  if(!t){
    toast('Tâche introuvable');
    return;
  }

  t.p=t.p||[];

  const safe=file.name
    .replace(/[^a-zA-Z0-9._-]/g,'_')
    .slice(-80);

  const path=
    me.id+'/'+cur+'/'+
    String(taskId)+'-'+
    Date.now()+'-'+
    safe;

  const r=await sb.storage
    .from('photos')
    .upload(path,file,{
      upsert:false,
      contentType:file.type||'image/jpeg'
    });

  if(r.error){
    toast('Erreur photo: '+r.error.message);
    return;
  }

  t.p.push(path);

  await save(cur);

  toast('Photo ajoutée');
}

async function deletePhoto(taskId,path){
  const d=day(cur);
  const t=(d.tasks||[]).find(x=>String(x.id)===String(taskId));

  if(!t)return;

  t.p=(t.p||[]).filter(x=>x!==path);

  const r=await sb.storage
    .from('photos')
    .remove([path]);

  if(r.error){
    toast('Erreur suppression photo');
  }

  delete urls[path];

  await save(cur);

  render();
}

async function addTask(){
  const d=day(cur);

  d.tasks=d.tasks||[];

  const id=
    Date.now().toString(36)+
    Math.random().toString(36).slice(2,7);

  d.tasks.push({
    id,
    n:'',
    s:0,
    pr:0,
    cat:'',
    mat:'',
    note:'',
    st:null,
    en:null,
    p:[]
  });

  open.add(id);

  await save(cur);

  render();
}

async function setStatus(id,v){
  const d=day(cur);

  const t=(d.tasks||[]).find(
    x=>String(x.id)===String(id)
  );

  if(!t)return;

  v=Number(v);

  t.s=v;

  if(v===1&&!t.st){
    t.st=new Date().toISOString();
  }

  if(v===2){
    if(!t.st)t.st=new Date().toISOString();
    t.en=new Date().toISOString();
  }

  if(v<2){
    t.en=null;
  }

  await save(cur);

  render();
}

async function startWork(){
  const d=day(cur);

  if(!d.inAt){
    d.inAt=new Date().toISOString();
    d.outAt=null;
    await save(cur);
    render();
  }
}

async function stopWork(){
  const d=day(cur);

  if(!d.inAt){
    toast('La journée n’a pas commencé');
    return;
  }

  d.outAt=new Date().toISOString();

  const running=(d.brk||[]).find(x=>x.s&&!x.e);

  if(running){
    running.e=d.outAt;
  }

  await save(cur);
  render();
}

async function breakToggle(){
  const d=day(cur);

  d.brk=d.brk||[];

  const running=d.brk.find(x=>x.s&&!x.e);

  if(running){
    running.e=new Date().toISOString();
  }else{
    d.brk.push({
      s:new Date().toISOString(),
      e:null
    });
  }

  await save(cur);
  render();
}

async function cmd(){
  const input=$('#quickCmd');

  if(!input)return;

  const text=input.value.trim();

  if(!text)return;

  const d=day(cur);

  d.tasks=d.tasks||[];

  const id=
    Date.now().toString(36)+
    Math.random().toString(36).slice(2,7);

  d.tasks.push({
    id,
    n:text,
    s:0,
    pr:0,
    cat:'',
    mat:'',
    note:'',
    st:null,
    en:null,
    p:[]
  });

  open.add(id);

  input.value='';

  await save(cur);
  render();
}

function quickBox(){
  return `
    <section class="sec">
      <h2>Ajouter rapidement</h2>

      <div class="bar">
        <input id="quickCmd" placeholder="Écrire une tâche...">
        <button class="p" data-a="cmd">Ajouter</button>
      </div>
    </section>
  `;
}

function updateTaskField(el){
  const box=el.closest('.t');

  if(!box)return;

  const id=box.dataset.task;
  const field=el.dataset.f;

  const d=day(cur);

  const t=(d.tasks||[]).find(
    x=>String(x.id)===String(id)
  );

  if(!t)return;

  let value=el.value;

  if(field==='pr'){
    value=Number(value)||0;
  }

  t[field]=value;

  save(cur);
}

async function handleClick(e){
  const b=e.target.closest('[data-a],[data-v]');

  if(!b)return;

  if(b.closest('.nav')&&b.dataset.v){
    view=b.dataset.v;

    if(view!=='team'){
      teamSel=null;
      teamDay=null;
    }

    render();
    return;
  }

  const a=b.dataset.a;

  if(!me){

    if(a==='li'){
      const email=$('#em')?.value.trim();
      const password=$('#pw')?.value||'';

      if(!email||!password){
        toast('Email et mot de passe requis');
        return;
      }

      const r=await sb.auth.signInWithPassword({
        email,
        password
      });

      if(r.error){
        $('#loginMsg').textContent=r.error.message;
        return;
      }

      await init();
      return;
    }

    if(a==='su'){
      const name=$('#sn')?.value.trim();
      const email=$('#se')?.value.trim();
      const password=$('#sp')?.value||'';

      if(!email||!password){
        toast('Email et mot de passe requis');
        return;
      }

      if(password.length<6){
        toast('Mot de passe: 6 caractères minimum');
        return;
      }

      const r=await sb.auth.signUp({
        email,
        password,
        options:{
          data:{name}
        }
      });

      if(r.error){
        $('#signupMsg').textContent=r.error.message;
        return;
      }

      if(r.data.session){
        await init();
      }else{
        $('#signupMsg').textContent=
          'Compte créé. Vérifiez votre email si la confirmation est activée.';
      }

      return;
    }

    return;
  }

  if(a==='in'){
    await startWork();
    return;
  }

  if(a==='out'){
    await stopWork();
    return;
  }

  if(a==='bs'){
    await breakToggle();
    return;
  }

  if(a==='td'){
    view='today';
    cur=today();
    render();
    return;
  }

  if(a==='add'){
    await addTask();
    return;
  }

  if(a==='cmd'){
    await cmd();
    return;
  }

  if(a==='tg'){
    const box=b.closest('.t');

    if(box){
      const id=box.dataset.task;

      if(open.has(id)){
        open.delete(id);
      }else{
        open.add(id);
      }

      render();
    }

    return;
  }

  if(a==='set'){
    await setStatus(
      b.dataset.id,
      b.dataset.v
    );
    return;
  }

  if(a==='del'){
    if(!confirm('Supprimer cette tâche ?'))return;

    const d=day(cur);

    d.tasks=(d.tasks||[]).filter(
      x=>String(x.id)!==String(b.dataset.id)
    );

    open.delete(String(b.dataset.id));

    await save(cur);
    render();
    return;
  }

  if(a==='cam'){
    pickPhoto(b.dataset.id,true);
    return;
  }

  if(a==='gal'){
    pickPhoto(b.dataset.id,false);
    return;
  }

  if(a==='rp'){
    await deletePhoto(
      b.dataset.id,
      b.dataset.path
    );
    return;
  }

  if(a==='zm'){
    const path=b.dataset.path;

    let url=urls[path];

    if(!url){
      const r=await sb.storage
        .from('photos')
        .createSignedUrl(path,3600);

      if(r.error){
        toast('Photo indisponible');
        return;
      }

      url=r.data.signedUrl;
      urls[path]=url;
    }

    $('#lb img').src=url;
    $('#lb').classList.add('on');

    return;
  }

  if(a==='prev'){
    const d=new Date(cur+'T12:00:00');
    d.setDate(d.getDate()-1);
    cur=ds(d);
    render();
    return;
  }

  if(a==='next'){
    const d=new Date(cur+'T12:00:00');
    d.setDate(d.getDate()+1);
    cur=ds(d);
    render();
    return;
  }

  if(a==='fl'){
    flt=Number(b.dataset.v);
    render();
    return;
  }

  if(a==='go'){
    cur=b.dataset.k;
    view='today';
    open.clear();
    render();
    return;
  }

  if(a==='rep'){
    $('#shT').value=buildReport();
    $('#sh').classList.add('on');
    return;
  }

  if(a==='cp'){
    try{
      await navigator.clipboard.writeText($('#shT').value);
      toast('Rapport copié');
    }catch{
      $('#shT').select();
      document.execCommand('copy');
      toast('Rapport copié');
    }
    return;
  }

  if(a==='cl'){
    $('#sh').classList.remove('on');
    return;
  }

  if(a==='rf'){
    if(prof?.role==='manager'){
      await loadTeam();
    }else{
      await loadMine();
    }

    render();
    return;
  }

  if(a==='saveprofile'){
    await saveProf();
    toast('Profil enregistré');
    return;
  }

  if(a==='lo'){
    await sb.auth.signOut();
    me=null;
    prof=null;
    view='dash';
    render();
    return;
  }

  if(a==='emp'){
    await openEmp(b.dataset.id);
    return;
  }

  if(a==='back'){
    teamSel=null;
    teamDay=null;
    tdays=[];
    trev=[];
    tords=[];
    render();
    return;
  }

  if(a==='backday'){
    teamDay=null;
    render();
    return;
  }

  if(a==='refreshEmp'){
    if(teamSel){
      await openEmp(teamSel);
    }
    return;
  }

  if(a==='eday'){
    teamDay=b.dataset.k;
    render();
    return;
  }

  if(a==='role'){
    const id=b.dataset.id;
    const newRole=b.dataset.r;

    const r=await sb.rpc(
      'set_user_role',
      {
        target:id,
        new_role:newRole
      }
    );

    if(r.error){
      toast('Erreur rôle: '+r.error.message);
      return;
    }

    toast('Rôle mis à jour');

    await loadTeam();

    render();
    return;
  }

  if(a==='oadd'){
    const title=$('#ot')?.value.trim();
    const note=$('#on')?.value.trim();
    const dayValue=$('#od')?.value||today();
    const priority=Number($('#op')?.value)||0;

    if(!teamSel){
      toast('Salarié non sélectionné');
      return;
    }

    if(!title){
      toast('Titre de l’ordre requis');
      return;
    }

    const r=await sb
      .from('orders')
      .insert({
        employee_id:teamSel,
        created_by:me.id,
        manager_name:prof?.name||'',
        day:dayValue,
        title,
        note,
        priority,
        status:0
      });

    if(r.error){
      toast('Erreur ordre: '+r.error.message);
      return;
    }

    toast('Ordre envoyé');

    await openEmp(teamSel);
    return;
  }

  if(a==='os'){
    const id=b.dataset.id;
    const v=Number(b.dataset.v);

    const updates={
      status:v,
      done_at:v===2?new Date().toISOString():null
    };

    const r=await sb
      .from('orders')
      .update(updates)
      .eq('id',id);

    if(r.error){
      toast('Erreur ordre: '+r.error.message);
      return;
    }

    if(prof?.role==='manager'&&teamSel){
      await openEmp(teamSel);
    }else{
      const o=ords.find(x=>String(x.id)===String(id));

      if(o){
        o.status=v;
        o.done_at=updates.done_at;
      }

      render();
    }

    return;
  }

  if(a==='mvalid'){
    if(!teamSel||!teamDay)return;

    const note=$('#mdaynote')?.value.trim()||'';

    const r=await sb
      .from('reviews')
      .upsert({
        user_id:teamSel,
        day:teamDay,
        task_id:'',
        note,
        manager_name:prof?.name||'',
        validated_at:new Date().toISOString()
      },{
        onConflict:'user_id,day,task_id'
      });

    if(r.error){
      toast('Erreur validation: '+r.error.message);
      return;
    }

    if(!trev[teamDay])trev[teamDay]={};

    trev[teamDay]['']={
      user_id:teamSel,
      day:teamDay,
      task_id:'',
      note,
      manager_name:prof?.name||'',
      validated_at:new Date().toISOString()
    };

    toast('Journée validée');
    render();
    return;
  }

  if(a==='mrev'){
    if(!teamSel||!teamDay)return;

    const box=b.closest('.t');
    const note=box?.querySelector('[data-mnote]')?.value.trim()||'';
    const id=String(b.dataset.id);

    const r=await sb
      .from('reviews')
      .upsert({
        user_id:teamSel,
        day:teamDay,
        task_id:id,
        note,
        manager_name:prof?.name||'',
        validated_at:new Date().toISOString()
      },{
        onConflict:'user_id,day,task_id'
      });

    if(r.error){
      toast('Erreur observation: '+r.error.message);
      return;
    }

    if(!trev[teamDay])trev[teamDay]={};

    trev[teamDay][id]={
      user_id:teamSel,
      day:teamDay,
      task_id:id,
      note,
      manager_name:prof?.name||'',
      validated_at:new Date().toISOString()
    };

    toast('Observation enregistrée');
    render();
    return;
  }
}

document.addEventListener('click',async e=>{
  try{
    await handleClick(e);
  }catch(err){
    console.error(err);
    toast('Une erreur est survenue');
  }
});

document.addEventListener('input',e=>{
  const f=e.target.dataset?.f;

  if(f){
    updateTaskField(e.target);
    return;
  }

  const dfield=e.target.dataset?.d;

  if(dfield){
    const d=day(cur);
    d[dfield]=e.target.value;
    save(cur);
    return;
  }

  const sfield=e.target.dataset?.s;

  if(sfield&&prof){
    let v=e.target.value;

    if(sfield==='h'){
      v=Number(v)||8;
    }

    prof[sfield]=v;
    return;
  }
});

document.addEventListener('change',async e=>{
  const dfield=e.target.dataset?.d;

  if(dfield){
    const d=day(cur);
    d[dfield]=e.target.value;
    await save(cur);
    return;
  }

  const sfield=e.target.dataset?.s;

  if(sfield&&prof){
    let v=e.target.value;

    if(sfield==='h'){
      v=Number(v)||8;
    }

    prof[sfield]=v;
    await saveProf();
    return;
  }

  if(e.target.id==='datePick'){
    cur=e.target.value||today();
    open.clear();
    render();
  }
});

document.addEventListener('keydown',async e=>{
  if(e.key==='Enter'&&e.target.id==='quickCmd'){
    e.preventDefault();
    await cmd();
  }
});

$('#lb').addEventListener('click',e=>{
  if(e.target.id==='lb'){
    $('#lb').classList.remove('on');
  }
});

$('#sh').addEventListener('click',e=>{
  if(e.target.id==='sh'){
    $('#sh').classList.remove('on');
  }
});

setInterval(live,1000);

sb.auth.onAuthStateChange((event,session)=>{
  setTimeout(async()=>{
    if(event==='SIGNED_OUT'){
      me=null;
      prof=null;
      render();
    }else if(event==='SIGNED_IN' || event==='USER_UPDATED'){
      if(session?.user){
        await init();
      }
    }
  },0);
});

init();
</script>

</body>
</html>
